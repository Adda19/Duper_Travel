# factory.conf: how the factory works in this repo (Flutter app). Adapted from the workshop kit (kit.sh).
# TEST_CMD runs the tests (required). SCOPE lists the paths agents may change (required).
# RUNTIME is checked by doctor.sh, SETUP prepares a fresh clone, LINT_CMD is optional.
TEST_CMD="flutter test"
LINT_CMD=""
SCOPE="lib/ test/"
RUNTIME="flutter"
SETUP="flutter pub get"
PROTECT_EXTRA=""

# Not a fork of a workshop repo: the tickets and the PRs live in this repo.
export FACTORY_UPSTREAM="${FACTORY_UPSTREAM:-Adda19/Duper_Travel}"

# The room board (workshop): runs send events to it. No code, prompts or file contents are sent.
# To stop sending, empty the URL: FACTORY_TELEMETRY_URL= ./factory.sh 1, or delete these lines.
export FACTORY_TELEMETRY_URL="${FACTORY_TELEMETRY_URL-https://zkzvi62sweveewxcsgga42ysbi0thgrb.lambda-url.us-east-1.on.aws}"
export FACTORY_TELEMETRY_TOKEN="${FACTORY_TELEMETRY_TOKEN:-ObV0cTvktkwlJfGu3cb9ECinS2gXZD77TlShAlsP}"
export FACTORY_WORKSHOP="${FACTORY_WORKSHOP:-factory-workshop-11nov}"
