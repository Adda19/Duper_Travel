    <h1 id="title">Waiting for a run</h1>
    <div class="branch mono" id="branch">./factory.sh &lt;issue&gt;</div>
  </div>
  <div class="meters">
    <div class="meter"><b id="timer">0:00</b><span>elapsed</span></div>
    <div class="meter"><b id="cost">$0.00</b><span>cost</span></div>
    <div id="status" class="pill"><span class="dot"></span><span>Idle</span></div>
  </div>
</header>

<section class="pipeline" id="pipeline" aria-label="Factory phases"></section>

<section class="decision" id="decision" aria-live="polite" hidden></section>

<section class="panes">
  <div class="pane">
    <div class="pane-head">
      <h3 id="feed-title">Live activity</h3>
      <div class="tabs" id="phase-tabs"></div>
    </div>
    <div class="feed" id="feed"></div>
  </div>
  <div class="pane">
    <div class="pane-head">
      <h3>Contract files</h3>
      <div class="tabs" id="doc-tabs"></div>
    </div>
    <div class="doc" id="doc"></div>
  </div>
</section>

<script>
"use strict";
const PHASE_SUBTITLES = {
  1: "reads the issue, writes the plan",
  2: "tests first, then code",
  3: "runs checks, reports risks",
  4: "fresh eyes, gives the verdict",
};
// Lucide (ISC): check, x, loader-circle, circle
const SVG = (paths) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
const GLYPH = {
  check: SVG('<path d="M20 6 9 17l-5-5"/>'),
  x: SVG('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
  loader: SVG('<path d="M21 12a9 9 0 1 1-6.219-8.56"/>'),
  circle: SVG('<circle cx="12" cy="12" r="9"/>'),
};
const ICON = { done: GLYPH.check, failed: GLYPH.x, running: GLYPH.loader, pending: GLYPH.circle, skipped: GLYPH.circle };
const STATE_LABEL = { done: "Done", failed: "Stopped", running: "Running", pending: "Waiting", skipped: "Skipped" };
const $ = (id) => document.getElementById(id);

let state = null;
let selectedPhase = null;   // null = follow the running phase
let selectedDoc = null;     // null = follow the newest contract file
let stickToBottom = true;

// ── helpers ─────────────────────────────────────────────────
function esc(text) {
  return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}
function fmtTime(seconds) {
  const s = Math.max(0, Math.floor(seconds));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
}
function fmtCost(usd) { return `$${(usd || 0).toFixed(2)}`; }
function activePhase() {
  if (!state) return 1;
  const running = state.phases.find((p) => p.status === "running" || p.status === "failed");
  if (running) return running.num;
  const done = state.phases.filter((p) => p.status === "done");
  return done.length ? done[done.length - 1].num : 1;
}
function shownPhase() { return selectedPhase ?? activePhase(); }
function newestDoc() {
  const ready = state ? state.phases.filter((p) => state.docs[p.doc]) : [];
  return ready.length ? ready[ready.length - 1].doc : "plan.md";
}
function shownDoc() { return selectedDoc ?? newestDoc(); }

// ── markdown (escaped first; supports what the agents write) ─
function inline(text) {
  // Code spans are set aside first so `app/*` is never read as emphasis.
  const spans = [];
  return esc(text)
    .replace(/`([^`]+)`/g, (_, code) => `\u0000${spans.push(code) - 1}\u0000`)
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${spans[Number(i)]}</code>`);
}
function verdictLine(line) {
  // Same normalisation as verdict_is_approve() in factory.sh.
  const m = line.replace(/[*`_#>\s]/g, "").replace(/\.$/, "").match(/^VERDICT:(APPROVE|REJECT)$/i);
  if (!m) return null;
  const ok = m[1].toUpperCase() === "APPROVE";
  return `<div class="verdict ${ok ? "ok" : "fail"}">${ok ? GLYPH.check : GLYPH.x}VERDICT: ${ok ? "APPROVE" : "REJECT"}</div>`;
}
function renderTable(lines) {
  const cells = (l) => l.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
  const head = cells(lines[0]).map((c) => `<th>${inline(c)}</th>`).join("");
  const body = lines.slice(2).map((l) => `<tr>${cells(l).map((c) => `<td>${inline(c)}</td>`).join("")}</tr>`).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}
function markdown(src) {
  const lines = src.replace(/\r/g, "").split("\n");
  const out = [];
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (/^```/.test(line)) {
      const code = [];
      for (i++; i < lines.length && !/^```/.test(lines[i]); i++) code.push(lines[i]);
      out.push(`<pre><code>${esc(code.join("\n"))}</code></pre>`); i++; continue;
    }
    if (/^\s*\|/.test(line) && /^\s*\|?[\s:|-]+\|?\s*$/.test(lines[i + 1] || "") && (lines[i + 1] || "").includes("-")) {
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push(renderTable(rows)); continue;
    }
    const verdict = verdictLine(line);
    if (verdict) { out.push(verdict); i++; continue; }
    const h = line.match(/^(#{1,4})\s+(.*)$/);
    if (h) { out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line);
      const items = [];
      while (i < lines.length) {
        if (/^\s*([-*]|\d+\.)\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
        else if (/^\s{2,}\S/.test(lines[i]) && items.length) items[items.length - 1] += " " + lines[i++].trim();
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>${items.map((t) => `<li>${inline(t)}</li>`).join("")}</${tag}>`); continue;
    }
    if (/^>\s?/.test(line)) { out.push(`<blockquote>${inline(line.replace(/^>\s?/, ""))}</blockquote>`); i++; continue; }
    if (!line.trim()) { i++; continue; }
    const para = [];
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|```|\s*[-*]\s|\s*\d+\.\s|\s*\||>)/.test(lines[i]) && !verdictLine(lines[i])) para.push(lines[i++]);
    if (para.length) out.push(`<p>${inline(para.join(" "))}</p>`); else i++;
  }
  return out.join("\n");
}

// ── rendering ───────────────────────────────────────────────
function gate(status) {
  const glyph = { ok: GLYPH.check, fail: GLYPH.x, running: GLYPH.loader }[status] || "";
  return `<span class="diamond ${status}"><i>${glyph}</i></span>`;
}
function joint({ doc = null, label = "", diamond = "", lit = false, extra = "" }) {
  const ready = doc && Boolean(state.docs[doc]);
  const chip = doc
    ? `<span class="doc-chip ${ready ? "ready" : ""}" data-doc="${doc}" title="contract file: the only thing the next phase reads">${doc}</span>`
    : '<span class="doc-chip none">·</span>';
  return `<div class="joint">${chip}<div class="line ${lit || ready ? "lit" : ""}">${diamond}</div><span class="label">${esc(label)}</span>${extra}</div>`;
}
// The 3→4 checkpoint: the scope check plus the participant's gates from gates/.
// One diamond (✗ if any gate failed), and the gates listed by name under the label.
function checkpointAfter3() {
  const gates = state.gates.filter((g) => g.event === "gate");
  if (!gates.length) return { label: "scope", diamond: scopeGate(3), extra: "" };
  const passed = (g) => g.ok === "true" || g.ok === true;
  const names = gates.map((g) => `<span class="${passed(g) ? "ok" : "fail"}" title="gate ${esc(g.name)}: ${passed(g) ? "passed" : "stopped the run"}">${passed(g) ? "✓" : "✗"} ${esc(g.name)}</span>`).join("");
  return { label: "checks", diamond: gates.every(passed) ? scopeGate(3) : gate("fail"), extra: `<span class="gate-names">${names}</span>` };
}
function scopeGate(after) {
  const g = [...state.gates].reverse().find((e) => String(e.after) === String(after));
  if (!g) return gate("", "·");
  const ok = g.ok === "true" || g.ok === true;
  return gate(ok ? "ok" : "fail", ok ? "✓" : "✗");
}
function cardHtml(p) {
  const stats = p.stats ? `${p.stats.turns} turns · ${p.stats.seconds}s · ${fmtCost(p.stats.cost)}` : p.status === "running" ? "working…" : "";
  // "Bash(./venv/bin/python -m pytest:*)" -> "pytest"; one chip per distinct command
  const commands = p.tools.map((t) => t.replace(/^Bash\((.*?)(:\*)?\)$/, "$1").replace(/^(\.?\/?venv\/bin\/)?(python -m )?/, "").replace(/ (main|\.|-\S+)( .*)?$/, ""));  // "git diff --stat main" -> "git diff"
  const tools = [...new Set(commands)].map((c) => `<code>${esc(c)}</code>`).join("");
  return `<article class="card ${p.status} ${shownPhase() === p.num ? "selected" : ""}" data-phase="${p.num}">
    <div class="top"><span class="n"><span class="num-pill">${p.num}</span>Phase</span><span class="state">${ICON[p.status]}${STATE_LABEL[p.status]}</span></div>
    <h2>${esc(p.name)}</h2>
    <div class="sub">fresh session · ${PHASE_SUBTITLES[p.num]}</div>
    <div class="stats">${stats}</div>
    ${tools ? `<div class="tools" title="shell commands this phase may run">${tools}</div>` : ""}
  </article>`;
}
function finalCard(run) {
  if (run.status === "pr") return `<article class="card final ok"><span class="n">Pull request</span><h2>Approved</h2><div><a href="${esc(run.pr_url)}" target="_blank" rel="noopener">${esc(run.pr_url.replace(/^https:\/\/github.com\//, ""))}</a></div><div class="sub">a human decides the merge</div></article>`;
  if (run.status === "committed") return `<article class="card final ok"><span class="n">Pull request</span><h2>Approved</h2><div class="sub">committed locally, push skipped (rehearsal)</div></article>`;
  if (run.status === "rejected" && run.pr_url) return `<article class="card final fail"><span class="n">Verdict</span><h2>Rejected</h2><div><a href="${esc(run.pr_url)}" target="_blank" rel="noopener">${esc(run.pr_url.replace(/^https:\/\/github.com\//, ""))}</a></div><div class="sub">draft PR opened</div></article>`;
  if (run.status === "rejected") return `<article class="card final fail"><span class="n">Verdict</span><h2>Rejected</h2><div class="sub">nothing was pushed (rehearsal)</div></article>`;
  const gate = run.preflight === "failed" || /scope violation|no changes under/.test(run.reason || "");
  if (run.status === "failed") return `<article class="card final fail"><span class="n">Stopped</span><h2>${gate ? "Gate closed" : "Stopped"}</h2><div class="sub">${esc(run.reason || "")}</div></article>`;
  return `<article class="card final pending"><span class="n">Pull request</span><h2>Waiting</h2><div class="sub">opens when the verdict is in</div></article>`;
}
function renderPipeline() {
  const run = state.run;
  const pre = { ok: ["ok", "✓"], failed: ["fail", "✗"], running: ["running", "…"] }[run.preflight] || ["", "·"];
  const verdict = run.verdict ? (run.verdict === "APPROVE" ? ["ok", "✓"] : ["fail", "✗"]) : ["", "·"];
  const [p1, p2, p3, p4] = state.phases;
  const ap = state.approval;
  const human = { waiting: ["running", "…"], replanning: ["fail", "✗"], approved: ["ok", "✓"] }[ap.state];
  const planJoint = human ? joint({ doc: p1.doc, label: "human", diamond: gate(...human), lit: ap.state === "approved" }) : joint({ doc: p1.doc });
  // ◇preflight  1 ─plan.md─ 2 ─build.md ◇scope─ 3 ─report.md ◇scope─ 4 ─review.md ◇verdict─ PR
  $("pipeline").innerHTML = [
    joint({ label: "preflight", diamond: gate(...pre), lit: run.preflight === "ok" }),
    cardHtml(ap.round > 1 ? { ...p1, name: `${p1.name} · round ${ap.round}` } : p1), planJoint,
    cardHtml(p2), joint({ doc: p2.doc, label: "scope", diamond: scopeGate(2) }),
    cardHtml(p3), joint({ doc: p3.doc, ...checkpointAfter3() }),
    cardHtml(p4), joint({ doc: p4.doc, label: "verdict", diamond: gate(...verdict) }),
    finalCard(run),
  ].join("");
}
function renderHeader() {
  const run = state.run;
  const labels = { idle: "Idle", running: "Running", awaiting_approval: "Your call", pr: "PR opened", committed: "Approved", rejected: "Rejected", failed: "Stopped" };
  const tone = { running: "running", awaiting_approval: "running", pr: "ok", committed: "ok", rejected: "fail", failed: "fail" }[run.status] || "";
  $("status").className = `pill ${tone}`;
  $("status").innerHTML = `<span class="dot"></span><span>${labels[run.status] || esc(run.status)}</span>`;
  $("title").innerHTML = run.issue ? `<span class="num">#${esc(run.issue)}</span> ${esc(run.title || "…")}` : "Waiting for a run";
  $("branch").innerHTML = run.issue ? `${esc(run.branch || "")} ${run.replay ? '<span class="tag">replay</span>' : ""}` : "start one with <b>./factory.sh &lt;issue&gt;</b>";
  $("cost").textContent = fmtCost(state.cost);
  tickTimer();
}
function tickTimer() {
  if (!state || !state.run.started) { $("timer").textContent = "0:00"; return; }
  const end = state.run.ended ?? Date.now() / 1000;
  $("timer").textContent = fmtTime(end - state.run.started);
}
function renderTabs() {
  const active = shownPhase();
  $("phase-tabs").innerHTML = state.phases.map((p) =>
    `<button data-phase="${p.num}" class="${p.num === active ? "active" : ""}" ${p.status === "pending" ? "disabled" : ""}>${p.num}</button>`).join("")
    + `<button data-phase="follow" class="${selectedPhase === null ? "active" : ""}" title="follow the running phase (F)">follow</button>`;
  const doc = shownDoc();
  $("doc-tabs").innerHTML = state.phases.map((p) =>
    `<button data-doc="${p.doc}" class="${p.doc === doc ? "active" : ""}" ${state.docs[p.doc] ? "" : "disabled"}>${p.doc.replace(".md", "")}</button>`).join("");
}
function actionHtml(a) {
  if (a.kind === "text") return `<div class="row text"><div class="say">${markdown(a.detail)}</div></div>`;
  if (a.kind === "error") return `<div class="row error"><span class="badge error">${GLYPH.x}error</span><span class="detail">${esc(a.detail)}</span></div>`;
  const tool = esc(a.tool || "tool");
  return `<div class="row"><span class="badge ${tool.toLowerCase()}">${tool}</span><span class="detail">${esc(a.detail)}</span></div>`;
}
function emptyFeedHtml(phase) {
  const msg = state.run.status === "idle" ? "No run yet. In a terminal: <code>./factory.sh &lt;issue&gt;</code>"
    : phase.status === "pending" ? "This phase has not started." : "Starting a fresh Claude session…";
  return `<div class="empty">${msg}</div>`;
}
// Append-only while the same phase grows, so existing rows do not re-animate on every update.
function renderFeed() {
  const phase = state.phases.find((p) => p.num === shownPhase());
  $("feed-title").textContent = `Live activity · ${phase.num} ${phase.name}`;
  const feed = $("feed");
  const key = `${state.run.started}:${phase.num}`;
  const shown = feed.dataset.key === key ? Number(feed.dataset.count) : -1;
  if (shown === phase.actions.length && shown > 0) return;  // an empty feed re-renders so its placeholder follows the phase status
  if (shown > 0 && shown < phase.actions.length) {
    feed.insertAdjacentHTML("beforeend", phase.actions.slice(shown).map(actionHtml).join(""));
  } else {
    feed.innerHTML = phase.actions.length ? phase.actions.map(actionHtml).join("") : emptyFeedHtml(phase);
    feed.querySelectorAll(".row").forEach((r) => { r.style.animation = "none"; });
  }
  feed.dataset.key = key;
  feed.dataset.count = String(phase.actions.length);
  if (stickToBottom) feed.scrollTop = feed.scrollHeight;
}
function renderDoc() {
  const doc = shownDoc();
  const text = state.docs[doc];
  const html = text ? markdown(text) : `<div class="empty">${esc(doc)} appears here when its phase writes it.<br>It is the only thing the next phase gets to read.</div>`;
  const el = $("doc");
  if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; }
}
// The human's call on the plan. Rebuilt only when the question changes, so typing survives live updates.
let denying = false;
let sending = false;
let decisionError = "";
let sentFor = "";           // "<run start>:<round>" once the panel delivered an answer for that round
function decisionHtml(ap, status) {
  if (ap.state === "waiting" && status === "awaiting_approval" && sentFor === `${state.run.started}:${ap.round}`) {
    return `<div class="ask"><span class="eyebrow">${GLYPH.loader} Sent</span><h3>The factory is picking up your answer…</h3></div>`;
  }
  if (ap.state === "waiting" && status === "awaiting_approval") {
    const eyebrow = `<span class="eyebrow">Your call · plan round ${ap.round}</span>`;
    if (denying) return `<div class="ask">${eyebrow}<h3>What should the next plan change?</h3>
      <p>A fresh session rewrites the plan with this feedback, then asks you again.</p></div>
      <form id="deny-form"><textarea id="feedback" maxlength="2000" placeholder="e.g. Also return 404 for an unknown name" required></textarea>
      <div class="actions"><button type="submit" class="deny" ${sending ? "disabled" : ""}>${GLYPH.x}Send and re-plan</button>
      <button type="button" class="plain" data-act="cancel">Cancel</button>${decisionError ? `<span class="error">${esc(decisionError)}</span>` : ""}</div></form>`;
    return `<div class="ask">${eyebrow}<h3>The plan is ready. Build it?</h3>
      <p>Read <b>plan.md</b> on the right. Nothing is built until you approve it.</p>
      ${decisionError ? `<p class="error">${esc(decisionError)}</p>` : ""}</div>
      <div class="actions"><button class="approve" data-act="approve" ${sending ? "disabled" : ""}>${GLYPH.check}Approve plan</button>
      <button class="deny" data-act="deny" ${sending ? "disabled" : ""}>${GLYPH.x}Deny</button></div>`;
  }
  if (ap.state === "replanning" && status === "running") {
    const said = ap.feedback.map((f) => `<li>${esc(f)}</li>`).join("");
    return `<div class="ask"><span class="eyebrow">${GLYPH.loader} Re-planning · round ${ap.round}</span>
      <h3>A fresh session is rewriting the plan with your feedback</h3><ul class="said">${said}</ul></div>`;
  }
  return "";
}
function renderDecision() {
  const el = $("decision");
  const ap = state.approval;
  const key = `${state.run.started}:${ap.state}:${ap.round}:${state.run.status}:${denying}:${sending}:${decisionError}:${sentFor}`;
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  const typed = $("feedback")?.value ?? "";
  const html = decisionHtml(ap, state.run.status);
  el.hidden = !html;
  el.className = `decision ${ap.state === "replanning" || html.includes("picking up") ? "quiet" : ""}`;
  el.innerHTML = html;
  const box = $("feedback");
  if (box) { box.value = typed; box.focus(); }
}
async function sendDecision(decision, feedback = "") {
  sending = true; decisionError = ""; render();
  try {
    const r = await fetch("/api/decision", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ round: state.approval.round, decision, feedback }),
    });
    if (!r.ok) decisionError = (await r.json().catch(() => ({}))).detail || `the panel could not send it (${r.status}); answer in the terminal`;
    else { denying = false; sentFor = `${state.run.started}:${state.approval.round}`; }
  } catch {
    decisionError = "the panel is offline; answer in the terminal (y, or n <what to change>)";
  }
  sending = false; render();
}
function render() {
  if (!state) return;
  if (state.approval.state !== "waiting") { denying = false; decisionError = ""; }
  renderHeader(); renderPipeline(); renderDecision(); renderTabs(); renderFeed(); renderDoc();
}

// ── events ──────────────────────────────────────────────────
document.addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "approve") { sendDecision("approve"); return; }
  if (act === "deny") { denying = true; decisionError = ""; render(); return; }
  if (act === "cancel") { denying = false; decisionError = ""; render(); return; }
  const phaseEl = e.target.closest("[data-phase]");
  const docEl = e.target.closest("[data-doc]");
  if (docEl && !docEl.disabled && state?.docs[docEl.dataset.doc]) { selectedDoc = docEl.dataset.doc; render(); return; }
  if (phaseEl && !phaseEl.disabled) {
    const v = phaseEl.dataset.phase;
    selectedPhase = v === "follow" ? null : Number(v);
    stickToBottom = true; render();
  }
});
$("feed").addEventListener("scroll", (e) => {
  const el = e.target;
  stickToBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
});
document.addEventListener("submit", (e) => {
  if (e.target.id !== "deny-form") return;
  e.preventDefault();
  const feedback = $("feedback").value.trim();
  if (feedback) sendDecision("deny", feedback);
});
document.addEventListener("keydown", (e) => {
  if (e.target.closest?.("textarea, input")) {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) $("deny-form")?.requestSubmit();  // Cmd+Enter sends
    return;
  }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "f") { selectedPhase = null; selectedDoc = null; stickToBottom = true; render(); }
  else if (/^[1-4]$/.test(e.key)) { selectedPhase = Number(e.key); stickToBottom = true; render(); }
});

function setConn(ok) {
  const el = $("conn");
  el.className = `conn ${ok ? "" : "off"}`;
  el.lastElementChild.textContent = ok ? "live" : "reconnecting";
}
function connect() {
  const source = new EventSource("/api/stream");
  source.onopen = () => setConn(true);
  source.onmessage = (e) => {
    const next = JSON.parse(e.data);
    if (state && next.run.started !== state.run.started) { selectedPhase = null; selectedDoc = null; }
    state = next; render();
  };
  source.onerror = () => setConn(false);   // EventSource retries on its own
}
setInterval(tickTimer, 1000);
fetch("/api/state").then((r) => r.json()).then((s) => { state = s; render(); }).catch(() => setConn(false));
connect();
</script>
</body>
</html>
