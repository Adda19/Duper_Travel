/*
 * Provectus Design System — Portable CSS Bundle
 * Spec version: 6.12
 *
 * Framework-agnostic version of Provectus DS for HTML pages, slide
 * decks, and single-file artifacts. No build step. No Tailwind. No
 * Astro. Drop into any HTML doc and reference the classes below.
 *
 * Tokens at :root. Component primitives prefixed `ds-`. Mirrors the
 * Astro skill's design facts in `packages/pro-web/src/styles/global.css`.
 * When the design changes, both this file and the Astro skill's spec
 * must be updated together.
 *
 * Changelog (recent):
 *   6.12 — Dark ground and text ladder (§22). The dark ground moves to a
 *          neutral near-black (`--pv-dark-900/800/700`; the ink scale resolves
 *          to it inside `.ds-theme--dark`). Text keeps the light theme's three
 *          steps and two hues: tertiary charcoal-400, eyebrow `--pv-slate-on-dark`,
 *          labels and links `--pv-sage-tone-ink-dark`. Tertiary text on the
 *          sage band is sage-200 in both themes (charcoal-400 was 2.84:1).
 *   6.11 — Dark decks (§22.5). The dark mode now applies to a deck on
 *          request; no CSS changes, the layer already darkens every slide.
 *          Decks export dark to HTML and PDF only.
 *   6.10 — Dark theme for web pages (§22). Opt-in page mode:
 *          <body class="ds-on-dark ds-theme--dark">; light stays the
 *          default and decks stay light. Two new pack tokens,
 *          `--pv-stroke-on-dark` and `--pv-sage-tone-ink-dark`; chart
 *          tokens `--pv-chart-1..4`; a navbar component `.ds-nav` (§4.24).
 *          Hover becomes one rule in both themes: a dark fill lightens
 *          toward near-white, a white fill darkens toward ink, the hue never
 *          changes (the sage primary now lightens in light too; a ghost on
 *          the ink band and the white button on the sage band get a visible
 *          hover; a logo never recolours). Dark focus ring and print rule.
 *   6.9  — Semantic tone layer. Four tones — `positive` / `caution` /
 *          `critical` / `neutral` — as tokens at `:root`, an alias layer
 *          (`--pv-tone-<tone>-<role>`) that author-facing CSS must use
 *          instead of the raw family token, and a `.ds-tone--*` modifier
 *          family that `.ds-card`, `.ds-icon` and the new `.ds-tone-label`
 *          consume. SEVEN new hex, no more: `--pv-sage-tone-bg` pack-value,
 *          `--pv-sage-tone-stroke` pack-value, `--pv-ochre-600` pack-value,
 *          `--pv-ochre-bg` pack-value, `--pv-ochre-200` pack-value,
 *          `--pv-ochre-300` pack-value, `--pv-sienna-200` pack-value. No second
 *          green — sage IS the positive tone. Sienna is promoted out of
 *          legacy to the `critical` ink, valid on white / cream / ink-900
 *          inside a `.ds-tone--critical` scope only; forbidden on the sage
 *          band, where it computes 2.85 against sage-600. Tone is never
 *          carried by colour alone: a glyph and a `.ds-tone-label` are
 *          mandatory. On dark, `--tone-bg` goes transparent and the tone
 *          reads from ink + stroke. `.ds-field-error` refactored onto the
 *          critical aliases — same pixels, no raw token. See REFERENCE.md
 *          §2.3a, §4.23, §10, §12, §19.4, §20 rules 18-19.
 *   6.8  — Dark surfaces rebind the type tokens. `.ds-section--dark`,
 *          `.ds-section--sage`, `.ds-slide--dark` and
 *          `.ds-cover--presentation` now rebind `--pv-text*` /
 *          `--pv-bg*` themselves, so a dark slide renders legible type
 *          without `.ds-on-dark`. Pairing stays valid. This header's
 *          `Spec version` had read 6.4 since then; a guard in
 *          `tests/test_scaffolds.py` now ties it to REFERENCE.md.
 *   6.7  — Root repair (rem root, deck scale unkeyed from `.ds-deck`,
 *   6.6  —   `.ds-stat-label` 18→16, surface cascade via `:where()`,
 *   6.5  —   deck type floor, icon primitive). Full entries live in
 *          `CHANGELOG.md`; they were never mirrored here.
 *   6.4  — Logo primitive + font cascade. **Logo:**
 *          `assets/logo/wordmark.svg` and
 *          `assets/logo/mark.svg` ship with the bundle,
 *          both `fill="currentColor"` so a single file works on every
 *          surface. New classes: `.ds-logo`, `.ds-logo--cover` (40px),
 *          `.ds-logo--footer` (18px), `.ds-logo--mark`. Color rebinds
 *          to near-white inside `.ds-on-dark`,
 *          `.ds-cover--presentation`, and `.ds-section--sage`.
 *          **Fonts:** three-tier cascade — system install (`local()`)
 *          → bundled WOFF2 at `assets/fonts/` → Google Fonts CSS API
 *          (`@import` at top). Variable WOFF2 files ship inside the
 *          skill, populated once by `scripts/fetch-fonts.py` and
 *          committed. End users never run the fetch script. CDN
 *          @import is the safety net for standalone HTML decks.
 *          REFERENCE.md §10 gains a logo placement constraint, §19
 *          documents both asset families (logo + fonts), §20 adds
 *          rules 14 (logo resolution) and 15 (font resolution,
 *          soft-warning semantics).
 *   6.3  — Slide Spec v0.1 reconciliation. Cover stays DARK (ink-900 +
 *          sage pattern overlay) per V2 reference — cover slot exempt
 *          from body dark cap. Dark body cap = 1/deck (Stats Band).
 *          Stat tier bumps 56→96px: `--pv-text-deck-stat-value` = 6rem.
 *          §2.4 gains a `Presentation/*` Figma style mapping mirrored
 *          as `--pv-text-deck-*` CSS tokens. NEW vertical-alignment
 *          hard rule. §18 reordered with Agenda at slot 02. NEW §20
 *          Skill Behavior Rules. CARD BORDER RULE CORRECTED:
 *          `.ds-card` (white-bg) carries the 1px stroke-divider border;
 *          `.ds-card-featured` (cream-bg) does NOT — surface contrast
 *          alone lifts it. Auto-flip on `.ds-section--alt` swaps the
 *          featured card cream→white AND applies the border.
 *   6.2  — Deck typography release. Parallel `--pv-text-deck-*` token
 *          set. 4-up `.ds-stats-grid--4` becomes deck default.
 *          `.ds-stats-united` cream-pivot variant. Thin deck hero-rule
 *          variant + `.ds-attribution`. Em-dash eyebrow prefix allowed.
 *          ASCII straight quotes allowed.
 *   6.1  — Slide pattern library. §18 contracts, §19 cover-pattern
 *          asset, ~17 new deck-only component primitives.
 *   6.0  — Design-build realign. Cut Plus Jakarta Sans and
 *          `--pv-font-accent`. `.ds-stat-value` switches to Plus
 *          Jakarta Sans 700. Cut `.ds-claim--blue` and
 *          `.ds-claim-label--blue` per the §10 indigo rule.
 *   5.0  — Responsive H2 tokens.

 *   4.9  — Page-rhythm alternation is opt-in.

/* ── Web fonts (v6.4 — three-tier cascade) ────────────────────────── *
 *
 * Resolution order, fastest to slowest:
 *   1. System install — `local()` in the src cascade. Zero bytes,
 *      instant. Hits when the viewer has the pack's display or
 *      mono family installed via Homebrew, Font Book, etc.
 *   2. Skill-bundled WOFF2 — `assets/fonts/*.woff2`. Ships with the
 *      skill repo; populated via `python3 scripts/fetch-fonts.py`
 *      once by the skill maintainer. End users never run the script.
 *   3. Google Fonts CSS API — `@import` at the top. The CSS API
 *      declares its own @font-face rules with current gstatic URLs

/* ── Tokens ──────────────────────────────────────────────────────── */

:root {
  /* Sage — primary brand */
  --pv-sage-50: #EEF3F0;
  --pv-sage-100: #DCE8E2;
  --pv-sage-200: #B8CEC4;
  --pv-sage-400: #6B8B7B;
  --pv-sage-600: #3B5249;
  --pv-sage-700: #33473F;
  --pv-sage-800: #263831;

  /* Ink — structural dark */
  --pv-ink-300: #828598;
  --pv-ink-700: #2A2D3F;
  --pv-ink-800: #232636;
  --pv-ink-900: #1C1F2E;

  /* Charcoal — reading text */
  --pv-charcoal-400: #8A9A8A;
  --pv-charcoal-500: #82827A;
  --pv-charcoal-700: #4A4A43;
  --pv-charcoal-800: #2C2B28;

  /* Indigo — highlighter (3-5 instances per artifact, max) */
  --pv-blue-600: #4255F9;

  /* Slate — section eyebrow on white */
  --pv-slate: #828598;

  /* Sienna — the `critical` tone ink (v6.9; promoted out of legacy).
     Valid on white, cream and ink-900, but ONLY inside a `.ds-tone--critical`
     scope, where a Lucide glyph and a `.ds-tone-label` carry the same meaning
     without relying on colour. Free-floating sienna text on white — outside
     that scope — stays forbidden (§12). Never on the sage band: the on-dark
     ink computes 2.85 against sage-600, below the 3:1 non-text floor (§10). */
  --pv-sienna-200: #E9BCAB;          /* NEW v6.9 — critical tone stroke */
  --pv-sienna-400: #FF8C4C;
  --pv-sienna-500: #D97F4A;          /* critical tone ink on dark */
  --pv-sienna-600: #B33A22;          /* aligned to REFERENCE §2.2 + /ds (was pack-value) */

  /* Ochre — the `caution` tone (v6.9). Hue 43°, chosen to sit between the
     sage brand and the sienna critical ink without reading as either. Four
     new hex; no other family gains a member. */
  --pv-ochre-200: #DCC58A;           /* NEW v6.9 — caution tone stroke */
  --pv-ochre-300: #D3B26A;           /* NEW v6.9 — caution tone ink on dark */
  --pv-ochre-600: #806520;           /* NEW v6.9 — caution tone ink */

  /* Surfaces */
  --pv-white: #FFFFFF;
  --pv-cream: #FDF8F4;          /* cards, warmer band */
  --pv-sienna-bg: #FBF1EE;          /* critical tone surface + form error-chip surface (v6.9; hex aligned to REFERENCE §2.2 + /ds in Wave 1.5, was pack-value) */
  --pv-ochre-bg: #FBF4E6;          /* NEW v6.9 — caution tone surface */
  --pv-sage-tone-bg: #E4F1E9;    /* NEW v6.9 — positive tone surface (NOT sage-50; see §2.3a) */
  --pv-sage-tone-stroke: #A9C7B7;    /* NEW v6.9 — positive tone stroke */
  --pv-near-white: #FAFAFA;          /* heading on dark */
  --pv-body-light: #D4D2CC;          /* body on dark */
  --pv-muted: #BFC1CA;
  --pv-sage-band: #ECF1EB;          /* cooler band (replaces sky-50) */

  /* Strokes */
  --pv-stroke-divider: #ECECEA;
  --pv-stroke-card-proof: #E8ECE8;
  --pv-stroke-card-sage: #759283;
  --pv-stroke-dark: #33332E;
  --pv-stroke-on-dark: #3A3A3A;   /* NEW v6.10 — border and divider on a dark page (§22) */
  --pv-sage-tone-ink-dark: #91CAAD; /* NEW v6.10 — positive tone ink on a dark page (§22) */
  --pv-dark-900: #151515;   /* NEW v6.12 — page ground on a dark page or deck (§22) */
  --pv-dark-800: #212121;   /* NEW v6.12 — card on a dark page */
  --pv-dark-700: #2A2A2A;   /* NEW v6.12 — card inside a band, table header on a dark page */
  --pv-slate-on-dark: #A6AABB;   /* NEW v6.12 — eyebrow on a dark page (slate, lightened) */

  /* Semantic — light surface */
  --pv-bg: #FFFFFF;
  --pv-bg-secondary: var(--pv-cream);
  --pv-bg-band: var(--pv-sage-600);
  --pv-bg-band-card: var(--pv-sage-700);
  --pv-bg-accent: var(--pv-sage-50);

  --pv-text: var(--pv-ink-900);
  --pv-text-secondary: var(--pv-charcoal-700);
  --pv-text-tertiary: var(--pv-charcoal-500);
  --pv-text-inverse: var(--pv-near-white);
  --pv-text-accent: var(--pv-sage-600);
  --pv-text-eyebrow: var(--pv-slate);
  --pv-text-label: var(--pv-sage-600);
  --pv-text-link: var(--pv-sage-600);

  --pv-border: var(--pv-stroke-divider);
  --pv-border-accent: var(--pv-stroke-card-sage);

  /* Semantic — on dark (use inside .ds-on-dark scope) */
  --pv-text-on-dark: var(--pv-near-white);
  --pv-text-body-on-dark: var(--pv-body-light);
  --pv-text-label-on-dark: var(--pv-sage-200);

  /* ── Semantic tone (v6.9) — REFERENCE.md §2.3a ────────────────────────
   * Four tones: what a sentence asserts about the READER's position, not
   * what it is about. positive = the reader gains something; caution = the
   * claim is bounded by a condition; critical = something is prohibited,
   * fails, or is lost; neutral = a fact with no stance, and the default.
   *
   * Author-facing CSS references `--pv-tone-<tone>-<role>` and NEVER the raw
   * family token underneath. That indirection is the whole point of this
   * block: the palette can be retuned in one place without a repo-wide
   * find-and-replace, and the tests assert on the alias, not the hex. A raw
   * `--pv-ochre-600` or `--pv-sienna-600` in a component rule is a defect
   * (§12), and `.ds-field-error` was refactored onto the aliases to prove
   * the rule applies to the one component that predates it.
   *
   * No second green. Sage IS the positive tone — adding a "success green"
   * would split Provectus identity (see DECISIONS.md). Tone never uses
   * indigo: `--pv-blue-600` stays the capped data-marker highlight (§10).
   * ────────────────────────────────────────────────────────────────────── */

  /* positive — assurance, capability, guarantee. Two new hex. */
  --pv-tone-positive-ink: var(--pv-sage-600);          /* pack-value */
  --pv-tone-positive-bg: var(--pv-sage-tone-bg);      /* pack-value */
  --pv-tone-positive-stroke: var(--pv-sage-tone-stroke);  /* pack-value */
  --pv-tone-positive-ink-dark: var(--pv-sage-200);          /* pack-value */

  /* caution — condition, tradeoff, limit, "only if". Four new hex. */
  --pv-tone-caution-ink: var(--pv-ochre-600);         /* pack-value */
  --pv-tone-caution-bg: var(--pv-ochre-bg);          /* pack-value */
  --pv-tone-caution-stroke: var(--pv-ochre-200);         /* pack-value */
  --pv-tone-caution-ink-dark: var(--pv-ochre-300);         /* pack-value */

  /* critical — prohibition, failure, loss, hard boundary. One new hex. */
  --pv-tone-critical-ink: var(--pv-sienna-600);        /* pack-value */
  --pv-tone-critical-bg: var(--pv-sienna-bg);         /* pack-value */
  --pv-tone-critical-stroke: var(--pv-sienna-200);        /* pack-value */
  --pv-tone-critical-ink-dark: var(--pv-sienna-500);        /* pack-value */

  /* neutral — plain fact, no stance. Zero new hex. The default. */
  --pv-tone-neutral-ink: var(--pv-charcoal-700);      /* pack-value */
  --pv-tone-neutral-bg: var(--pv-white);             /* #FFFFFF */
  --pv-tone-neutral-stroke: var(--pv-stroke-divider);    /* pack-value */
  --pv-tone-neutral-ink-dark: var(--pv-body-light);        /* pack-value */

  /* Typography */
  --pv-font-display: "Plus Jakarta Sans", system-ui, sans-serif;
  --pv-font-sans: "Plus Jakarta Sans", system-ui, sans-serif;
  --pv-font-mono: "JetBrains Mono", ui-monospace, monospace;

  /* Type sizes */
  --pv-text-xs: 0.6875rem;            /* 11px eyebrow / mono */
  --pv-text-sm: 0.8125rem;            /* 13px small body */
  --pv-text-base: 0.9375rem;            /* 15px body */
  --pv-text-md: 1.0625rem;            /* 17px lede */
  --pv-text-lg: 1.25rem;              /* 20px small card title */
  --pv-text-xl: 1.5rem;               /* 24px card title / hero prose */
  --pv-text-2xl: 2rem;                 /* 32px — fixed; for stat values / non-heading */
  --pv-text-3xl: 2.5rem;               /* 40px — fixed; for stat values / phase names */
  --pv-text-4xl: 3rem;                 /* 48px inner-page hero */
  --pv-text-5xl: 4rem;                 /* 64px — top-of-scale Display (web scale, §2.4) */
  /* Responsive heading tokens (Spec 5.0). H2 base + sub-section step-down
     scale fluidly so section headings never exceed the H1 hero on mobile. */
  --pv-text-subsection: clamp(1.5rem, 3vw, 2rem);    /* 24→32px sub-section H2 */
  --pv-text-section: clamp(1.75rem, 4vw, 2.5rem); /* 28→40px section H2 (default) */
  --pv-text-hero: clamp(2rem, 4vw, 3rem);
  --pv-text-hero-lg: clamp(2.5rem, 5vw, 4rem);

  /* ── Deck-scale (decks only) — mirrors the Presentation/* Figma styles ────
     Use these tokens inside .ds-deck / .ds-slide containers ONLY. Mixing
     deck and web scales in the same artifact is a §10 hard rule violation. */
  --pv-text-deck-cover: 6.5rem;   /* 104px — Presentation/Display        */
  --pv-text-deck-headline: 4.5rem;   /*  72px — Presentation/Hero           */
  --pv-text-deck-stat-value: 6rem;     /*  96px — Presentation/Stat (v6.3)    */
  --pv-text-deck-card-title: 2.25rem;  /*  36px — Presentation/Title          */
  --pv-text-deck-secondary: 1.75rem;  /*  28px — Presentation/Title Sm       */
  --pv-text-deck-lede: 1.625rem; /*  26px — Presentation/Body Lg        */
  --pv-text-deck-body: 1.375rem; /*  22px — Presentation/Body           */
  --pv-text-deck-eyebrow: 1.125rem; /*  18px — Presentation/Eyebrow        */
  --pv-text-deck-footer: 1rem;     /*  16px — Presentation/Label          */
  --pv-text-display-stat: 15rem;    /* 240px — Presentation/NumberHighlight*/


  /* Leading */
  --pv-leading-tight: 1.1;
  --pv-leading-snug: 1.25;
  --pv-leading-normal: 1.5;
  --pv-leading-relaxed: 1.65;

  /* Tracking */
  --pv-tracking-tight: -0.02em;
  --pv-tracking-normal: 0;
  --pv-tracking-wide: 0.04em;
  --pv-tracking-wider: 0.08em;
  --pv-tracking-widest: 0.12em;

  /* Spacing */
  --pv-space-1: 0.25rem;
  --pv-space-2: 0.5rem;
  --pv-space-3: 0.75rem;
  --pv-space-4: 1rem;
  --pv-space-5: 1.25rem;
  --pv-space-6: 1.5rem;
  --pv-space-8: 2rem;
  --pv-space-10: 2.5rem;
  --pv-space-12: 3rem;
  --pv-space-16: 4rem;
  --pv-space-20: 5rem;
  --pv-space-24: 6rem;

  /* Radii */
  --pv-radius-sm: 6px;
  --pv-radius-md: 8px;
  --pv-radius-lg: 12px;
  --pv-radius-xl: 16px;
  --pv-radius-2xl: 20px;     /* inset bands */
  --pv-radius-full: 9999px;   /* indigo number pills */

  /* Motion */
  --pv-dur: 200ms;
  --pv-ease: cubic-bezier(0.4, 0, 0.2, 1);
}

/* ── Reset / baseline ────────────────────────────────────────────── */

*, *::before, *::after { box-sizing: border-box; }

/* The root defines what `rem` means, and nothing else. Every type token
   (§2.4) and every spacing step (§2.5) is declared in rem, so the root must
   stay at the browser default — 100% — for any of them to resolve to the px
   this spec documents.

   This used to read `html, body { font-size: var(--pv-text-base) }`. Setting
   the 15px body size on `html` redefined the rem unit for the whole document
   and then applied it a second time on `body`, so EVERY rem-declared value
   landed exactly 6.25% short: the §10 22px deck body floor computed at
   20.625px and was unreachable by any deck, `.ds-slide` padding computed at
   60px and broke the §17 identity that makes a figure canvas 1792 units wide
   at 1920, and all ten web tokens in §2.4 resolved under their stated px.
   v6.6 contained that for decks only, with `html.ds-deck { font-size: 16px }`.
   This is the actual repair, and it covers web and artifact surfaces too. */
html { font-size: 100%; }

body {
  margin: 0;
  padding: 0;
  background: var(--pv-bg);
  color: var(--pv-text);
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-base);
  line-height: var(--pv-leading-relaxed);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

html { margin: 0; padding: 0; background: var(--pv-bg); }

img, svg, video { display: block; max-width: 100%; height: auto; }

a { color: var(--pv-text-link); text-decoration: none; }
a:hover { color: var(--pv-text-accent); }

/* ── Dark theme — every dark-ground surface rebinds the type tokens ──
 *
 * A surface that paints a dark background is responsible for rebinding the
 * type tokens along with it. A `color` declaration on the surface is NOT
 * enough: every type component binds its own color from a token
 * (.ds-heading-section declares `color: var(--pv-text)`, .ds-body declares
 * `color: var(--pv-text-secondary)`), so the ancestor's `color` is overridden
 * rather than inherited. .ds-slide--dark carried such a `color` for four spec
 * versions and its headings still measured 1.00:1 against their own ground.
 *
 * `.ds-on-dark` remains correct to write and is still REQUIRED for a dark
 * ground applied to an element this bundle does not know about (a custom
 * wrapper, an inline background). On the four surface classes below it is now
 * optional. See §10 "Cascade & ordering".
 * ──────────────────────────────────────────────────────────────────── */

.ds-on-dark,
.ds-section--dark,
.ds-section--sage,
.ds-slide--dark,
.ds-cover--presentation {
  --pv-bg:                var(--pv-ink-900);
  --pv-bg-secondary:      var(--pv-charcoal-800);
  --pv-text:              var(--pv-text-on-dark);
  --pv-text-secondary:    var(--pv-text-body-on-dark);
  --pv-text-tertiary:     var(--pv-charcoal-400);
  --pv-text-eyebrow:      var(--pv-text-label-on-dark);
  --pv-text-accent:       var(--pv-sage-200);
  --pv-text-label:        var(--pv-sage-200);
  --pv-border:            var(--pv-stroke-dark);
  --pv-border-accent:     var(--pv-sage-200);
  color: var(--pv-text);
}

/* The painting stays per-class — the backgrounds differ. .ds-on-dark is the
 * only one of the five that has no surface of its own, so it paints --pv-bg. */
.ds-on-dark { background: var(--pv-bg); }

/* ── Layout primitives ──────────────────────────────────────────── */

.ds-section {
  padding: var(--pv-space-16) var(--pv-space-4);
  background: var(--pv-bg);
}
.ds-section--alt { background: var(--pv-bg-secondary); }
.ds-section--dark { background: var(--pv-ink-900); }
.ds-section--hero {
  padding: var(--pv-space-24) var(--pv-space-4) var(--pv-space-20);
}
.ds-section--light-frame,
.ds-section--dark-frame {
  padding-top: var(--pv-space-12);
  padding-bottom: var(--pv-space-12);
}
.ds-section--stats {
  padding-top: var(--pv-space-8);
  padding-bottom: var(--pv-space-16);
}
@media (min-width: 640px) {
  .ds-section,
  .ds-section--hero,
  .ds-section--light-frame,
  .ds-section--dark-frame {
    padding-left: var(--pv-space-8);
    padding-right: var(--pv-space-8);
  }
}

.ds-container {
  max-width: 1100px;
  margin: 0 auto;
}

/* ── Typography primitives ──────────────────────────────────────── */

.ds-heading-hero {
  font-family: var(--pv-font-display);
  font-size: var(--pv-text-hero);
  font-weight: 800;
  line-height: var(--pv-leading-tight);
  letter-spacing: var(--pv-tracking-tight);
  color: var(--pv-text);
  margin: 0 0 var(--pv-space-5);
}
.ds-heading-hero-lg {
  font-family: var(--pv-font-display);
  font-size: var(--pv-text-hero-lg);
  font-weight: 800;
  line-height: var(--pv-leading-tight);
  letter-spacing: var(--pv-tracking-tight);
  color: var(--pv-text);
  margin: 0 0 var(--pv-space-5);
}
.ds-heading-section {
  font-family: var(--pv-font-display);
  font-size: var(--pv-text-section); /* Spec 5.0 — responsive */
  font-weight: 700;
  line-height: var(--pv-leading-snug);
  letter-spacing: var(--pv-tracking-tight);
  color: var(--pv-text);
  margin: 0;
}
.ds-heading-claim {
  font-family: var(--pv-font-display);
  font-size: var(--pv-text-subsection); /* Spec 5.0 — responsive */
  font-weight: 700;
  line-height: var(--pv-leading-snug);
  letter-spacing: var(--pv-tracking-tight);
  color: var(--pv-text);
  margin: 0;
}
.ds-body {
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-base);
  line-height: var(--pv-leading-relaxed);
  color: var(--pv-text-secondary);
  margin: 0;
}
.ds-lede {
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-md);
  line-height: var(--pv-leading-relaxed);
  color: var(--pv-text-secondary);
  margin: 0 0 var(--pv-space-10);
  max-width: 42rem;
}
.ds-eyebrow {
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-xs);
  font-weight: 600;
  letter-spacing: var(--pv-tracking-widest);
  text-transform: uppercase;
  color: var(--pv-text-eyebrow);
  margin: 0 0 var(--pv-space-4);
}
.ds-eyebrow-accent { color: var(--pv-sage-600); }
.ds-section-eyebrow {
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-xs);
  font-weight: 600;
  letter-spacing: var(--pv-tracking-widest);
  text-transform: uppercase;
  color: var(--pv-text-eyebrow);
  margin: 0 0 var(--pv-space-4);
}
.ds-section-header { margin-bottom: var(--pv-space-10); }

/* ── Buttons ────────────────────────────────────────────────────── */

.ds-btn {
  display: inline-flex;
  align-items: center;
  gap: var(--pv-space-2);
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-sm);
  font-weight: 600;
  letter-spacing: var(--pv-tracking-wide);
  border: 0;
  border-radius: var(--pv-radius-md);
  padding: var(--pv-space-3) var(--pv-space-5);
  cursor: pointer;
  text-decoration: none;
  transition: background var(--pv-dur) var(--pv-ease),
              color var(--pv-dur) var(--pv-ease),
              transform var(--pv-dur) var(--pv-ease);
}
.ds-btn-primary {
  background: var(--pv-sage-600);
  color: #FFFFFF;
}
.ds-btn-primary:hover {
  background: var(--pv-sage-700);
  color: #FFFFFF;
}
.ds-btn-ghost {
  background: transparent;
  color: var(--pv-text);
  border: 1px solid var(--pv-border);
}
.ds-btn-ghost:hover {
  background: var(--pv-bg-accent);
  color: var(--pv-text-accent);
}
.ds-btn-lg {
  padding: var(--pv-space-4) var(--pv-space-6);
  font-size: var(--pv-text-base);
}

/* ── Cards ──────────────────────────────────────────────────────── */

.ds-card {
  background: var(--pv-bg);
  border: 1px solid var(--pv-border);
  border-radius: var(--pv-radius-xl);
  padding: var(--pv-space-6);
}
.ds-card-featured {
  background: var(--pv-bg-secondary);
  /* No border on cream — surface contrast alone lifts the card. v6.3. */
  border-radius: var(--pv-radius-xl);
  padding: var(--pv-space-6);
  transition: transform var(--pv-dur) var(--pv-ease);
}
.ds-card-featured:hover { transform: translateY(-2px); }

.ds-card-tag {
  display: inline-flex;
  align-items: center;
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-xs);
  font-weight: 600;
  letter-spacing: var(--pv-tracking-widest);
  text-transform: uppercase;
  color: var(--pv-text-label);
  margin-bottom: var(--pv-space-3);
}
.ds-card-title {
  font-family: var(--pv-font-display);
  font-size: var(--pv-text-xl);
  font-weight: 700;
  line-height: var(--pv-leading-snug);
  letter-spacing: var(--pv-tracking-tight);
  color: var(--pv-text);
  margin: 0 0 var(--pv-space-3);
}
.ds-card-desc {
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-sm);
  color: var(--pv-text-secondary);
  line-height: var(--pv-leading-relaxed);
  margin: 0;
}

/* Section bg → card bg auto-flip */
/* Section bg → card bg auto-flip (v6.3): when a cream featured card
   lands on a cream section, flip it to white AND apply the border.
   `:not(...)` added in v6.9: a TONED featured card has already resolved its
   surface from the tone, and there is nothing to flip away from.

   Be precise about what this fixes, because the obvious claim is wrong. This
   rule and the tone rule BOTH sit at (0,2,0), and the tone block is declared
   ~700 lines later, so source order already resolves it in favour of the
   tone — measured, and the check passes with the `:not()` removed. What the
   exclusion buys is that the outcome stops DEPENDING on that ordering. §11.1
   is the record of what happens when it does: `.ds-slide` won a (0,1,0) tie
   over `.ds-section--alt` purely by being declared later, and the deck's one
   cream band could not render for four spec versions. The bundle's answer
   there was `:where()`; here it is `:not()`. Same principle — make the
   selector say what it means, so reordering the file cannot change the
   render. */
.ds-section--alt .ds-card-featured:not([class*="ds-tone--"]) {
  background: var(--pv-bg);
  border: 1px solid var(--pv-border);
}

/* ── Inset light bands ──────────────────────────────────────────── */

.ds-band-light {
  padding: var(--pv-space-12);
  border-radius: var(--pv-radius-2xl);
}
.ds-band-light--cream { background: var(--pv-cream); }
.ds-band-light--sage  { background: var(--pv-sage-band); }
@media (max-width: 640px) {
  .ds-band-light { padding: var(--pv-space-8); }
}

/* Side-by-side variant: header LEFT, content RIGHT */
.ds-band-light--split {
  display: flex;
  gap: var(--pv-space-10);
  align-items: flex-start;
}
.ds-band-light--split .ds-band-header {
  flex: 0 0 auto;
  width: 280px;
  display: flex;
  flex-direction: column;
  gap: var(--pv-space-4);
}
.ds-band-light--split .ds-claim-stack {
  flex: 1 1 0;
  min-width: 0;
  margin-bottom: 0;
}
@media (max-width: 900px) {
  .ds-band-light--split { flex-direction: column; gap: var(--pv-space-8); }
  .ds-band-light--split .ds-band-header { width: 100%; }
}

/* ── Claim variants (left-rule editorial blocks) ────────────────── */

.ds-claim {
  padding-left: var(--pv-space-5);
  border-left: 3px solid var(--pv-border-accent);
  max-width: 42rem;
}
/* Variant rules MUST come AFTER the base — same specificity, later wins. */
.ds-claim--card {
  background: #FFFFFF;
  border-left: none;
  padding: var(--pv-space-6);
  border-radius: var(--pv-radius-xl);
  max-width: none;
}
.ds-claim--sage { border-left-color: var(--pv-text-tertiary); }

.ds-claim-stack {
  display: flex;
  flex-direction: column;
  gap: var(--pv-space-8);
  margin-bottom: var(--pv-space-12);
}
.ds-claim-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--pv-space-8);
}
@media (min-width: 768px) {
  .ds-claim-grid--cols-2 { grid-template-columns: 1fr 1fr; }
}
.ds-claim-label {
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-xs);
  font-weight: 600;
  letter-spacing: var(--pv-tracking-widest);
  text-transform: uppercase;
  color: var(--pv-text-eyebrow);
  margin: 0 0 var(--pv-space-2);
}
.ds-claim-body {
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-base);
  line-height: var(--pv-leading-relaxed);
  color: var(--pv-text-secondary);
  margin: 0;
}

/* ── Hero editorial paragraph (HR / prose / HR) ────────────────── */

.ds-hero-rule {
  border: 0;
  border-top: 1px solid var(--pv-border);
  margin: 0;
}
.ds-hero-prose {
  font-family: var(--pv-font-display);
  font-size: var(--pv-text-xl);
  font-weight: 400;
  color: var(--pv-text);
  line-height: var(--pv-leading-snug);
  letter-spacing: var(--pv-tracking-tight);
  max-width: 60rem;
  margin: var(--pv-space-10) 0;
}
.ds-hero-prose strong { font-weight: 700; color: var(--pv-text); }

/* ── Indigo number pill — the highlighter ──────────────────────── */

.ds-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 26px;
  min-width: 32px;
  padding: 0 10px;
  background: var(--pv-blue-600);
  color: #FFFFFF;
  border-radius: var(--pv-radius-full);
  font-family: var(--pv-font-mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
}
.ds-square {
  display: inline-block;
  width: 16px;
  height: 16px;
  background: var(--pv-blue-600);
  border-radius: 8px;
}

/* ── Stats row ─────────────────────────────────────────────────── */

.ds-stats-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--pv-space-6);
}
@media (min-width: 640px) {
  .ds-stats-grid { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
}
/* 4-up variant — deck default for pattern.stats-band-ink (§18 Slide 07). */
.ds-stats-grid--4 { grid-template-columns: repeat(2, 1fr); }
@media (min-width: 768px) {
  .ds-stats-grid--4 { grid-template-columns: repeat(4, 1fr); }
}
.ds-stat-value {
  /* v6.0 — display face Bold, surface-adaptive color */
  font-family: var(--pv-font-display);
  font-size: var(--pv-text-3xl);
  font-weight: 700;
  color: var(--pv-text);
  line-height: var(--pv-leading-tight);
  letter-spacing: var(--pv-tracking-tight);
  margin: 0 0 var(--pv-space-2);
}
.ds-stat-label {
  font-family: var(--pv-font-mono);
  font-size: var(--pv-text-xs);
  letter-spacing: var(--pv-tracking-wider);
  text-transform: uppercase;
  color: var(--pv-text-tertiary);
  margin: 0;
}

/* ── Em-dash bullet list ───────────────────────────────────────── */

.ds-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: var(--pv-space-3); }
.ds-list li {
  padding-left: var(--pv-space-5);
  position: relative;
  font-family: var(--pv-font-sans);
  font-size: var(--pv-text-base);
  line-height: var(--pv-leading-relaxed);
  color: var(--pv-text);
}
.ds-list li::before {
  content: "\2014";
  position: absolute;
  left: 0;
  top: 0;
  color: var(--pv-text-accent);
}

/* ── Phase cards (3-col uniform cream) ─────────────────────────── */

.ds-three-col {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--pv-space-8);
}
@media (min-width: 768px) {
  .ds-three-col { grid-template-columns: repeat(3, 1fr); }
}
.ds-phase {
  display: flex;
  flex-direction: column;
  gap: var(--pv-space-2);
  padding: var(--pv-space-8);
  border-radius: var(--pv-radius-2xl);
  background: var(--pv-cream);
}
.ds-phase-num {
  font-family: var(--pv-font-mono);
  font-size: var(--pv-text-xs);
  letter-spacing: var(--pv-tracking-widest);
  text-transform: uppercase;
  color: var(--pv-text-tertiary);
  margin: 0 0 var(--pv-space-2);
}
.ds-phase-name {
  font-family: var(--pv-font-display);
  font-size: var(--pv-text-3xl);
  font-weight: 700;
  letter-spacing: var(--pv-tracking-tight);
  color: var(--pv-text);
  line-height: var(--pv-leading-snug);
  margin: 0;
}
.ds-phase-duration {
  font-family: var(--pv-font-mono);
  font-size: var(--pv-text-xs);
  letter-spacing: var(--pv-tracking-wider);
  color: var(--pv-text-tertiary);
  text-transform: uppercase;
  margin: 0 0 var(--pv-space-3);
}
.ds-phase-heading {
  font-family: var(--pv-font-display);
  font-size: var(--pv-text-base);
  font-weight: 600;
  color: var(--pv-text);
  margin: 0 0 var(--pv-space-3);
}

/* ── Slide deck shell (used by deck.html scaffold) ─────────────── */

.ds-deck {
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: var(--pv-bg);
}
.ds-slide {
  width: 100vw;
  height: 100vh;
  display: none;
  position: relative;   /* anchor the absolute .ds-slide-footer to each slide, not the initial containing block — otherwise footers pile up / vanish when slides are stacked for export (PDF/screenshot) */
  padding: var(--pv-space-16);
  flex-direction: column;
  justify-content: center;
  /* 16:9 lock — the inner content auto-scales via the container size */
}

/* Default slide surface, deliberately at zero specificity.
 *
 * The surface classes a slide composes with — .ds-section--alt (cream),
 * .ds-section--dark, .ds-section--sage — are declared ~430 lines EARLIER than
 * .ds-slide. All of them are single-class selectors, so they tie .ds-slide at
 * (0,1,0) and lose on source order: a `.ds-slide.ds-section--alt` slide painted
 * white, and pattern.cream-pivot (§18 slide 18) — the deck's one cream band —
 * could not render its documented surface at all. .ds-section--dark survived
 * only because .ds-on-dark rebinds --pv-bg to ink-900 on the same element, so
 * .ds-slide's own var(--pv-bg) happened to resolve dark; dropping .ds-on-dark
 * turned the surface white while the text stayed dark, i.e. it degraded in the
 * legible direction, which is why nobody caught it.
 *
 * :where() zeroes this rule's specificity, so ANY surface class beats it no
 * matter where it sits in the file. That removes the ordering dependency
 * instead of reordering it — a future rule move cannot reintroduce the bug.
 * Keeping the declaration (rather than deleting it and letting the slide go
 * transparent over .ds-deck) means a bare slide still computes an explicit
 * white, so the invariant is assertable and --pv-bg stays the single source
 * for the default surface. See §10 "Cascade & ordering".
 */
:where(.ds-slide) { background: var(--pv-bg); }

.ds-slide.is-active { display: flex; }
.ds-slide--dark { background: var(--pv-ink-900); }   /* type colors come from the dark-surface token rebinding above */
.ds-slide--alt  { background: var(--pv-bg-secondary); }
.ds-slide-num {
  position: absolute;
  bottom: var(--pv-space-6);
  right: var(--pv-space-6);
  font-family: var(--pv-font-mono);
  font-size: var(--pv-text-xs);
  letter-spacing: var(--pv-tracking-widest);
  color: var(--pv-text-tertiary);
}

@media print {
  .ds-deck { width: auto; height: auto; }
  .ds-slide {
    display: flex !important;
    position: relative !important;   /* override any deck-local position:absolute so slides flow one-per-page instead of stacking (vector PDF export) */
    page-break-after: always;
    width: 100vw;
    height: 100vh;
  }
  .ds-slide:last-child { page-break-after: auto; }  /* no trailing blank page */
}

/* Presentation cover — dark by default per v6.3 §10 + §19 (V2 reference).
 * v6.4: three-zone layout (logo top / content center / meta bottom), no fixed
 * min-height, own stacking context. Shared by the closing bookend, which layers
 * `.ds-slide--close` on top to re-center. `display:flex` comes from
 * `.ds-slide.is-active` — this class sets only the axis/justify (§10, §11.9). */
.ds-cover--presentation {
  position: relative;
  min-height: 0;                     /* was 1080px — a fixed floor overflows sub-1080 laptops and clips the bottom-pinned meta; the slide is already 100vh via .ds-slide (§11.10 / §19.1) */
  isolation: isolate;                /* scope child z-index so the pattern bg + lifted content never paint over sibling slides (§11.10) */
  flex-direction: column;
  justify-content: space-between;    /* three zones: logo (top) / content (center) / meta (bottom) */
  background-color: var(--pv-ink-900);
  padding: var(--pv-space-12) var(--pv-space-16) var(--pv-space-16);
  /* Type colors rebind from this class itself; `.ds-on-dark` is optional here
     and still correct to write. */
}

/* ── v6.4 deck composition helpers ───────────────────────────────────
 * Cover three-zone content, closing bookend, and content-slide body-center.
 * None set `display` (visibility is owned by `.ds-slide.is-active`); they set
 * only the flex axis/justify — a variant `display` would defeat the toggle and
 * bleed the slide through every other slide (§10 Cascade, §11.9). Declared
 * after `.ds-cover--presentation` so the close's justify override wins.
 * ──────────────────────────────────────────────────────────────────── */

/* Cover — zone 2 (centered content) + zone 3 (meta line), both lifted above the pattern bg. */
.ds-cover--presentation > .ds-logo,
.ds-cover-center,
.ds-cover-meta-row { position: relative; z-index: 1; }
.ds-cover-center { max-width: 1640px; }
.ds-cover-center .ds-heading-deck-cover { text-wrap: balance; }                  /* even wraps, no orphaned word */
.ds-cover-lede { margin-top: calc(var(--pv-space-6) + 20pt); max-width: 44ch; }  /* explicit title→lede gap; constrain the lede, never the headline */
.ds-cover-meta-row {
  display: flex;
  gap: var(--pv-space-8);
  font-family: var(--pv-font-mono);
  font-size: var(--pv-text-deck-footer);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--pv-text-tertiary);
}

/* Content slides (§18 body) — eyebrow + headline pinned top, the single content
   block below centered in the remaining space (last-child auto-margins). */
.ds-slide-inner { width: 100%; max-width: 1240px; margin: 0 auto; }
.ds-slide--body-center { justify-content: flex-start; }
.ds-slide--body-center .ds-slide-inner { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
.ds-slide--body-center .ds-slide-inner > :last-child { margin-top: auto; margin-bottom: auto; }

/* Closing contact slide — dark bookend mirroring the cover. Reuses
   `.ds-cover--presentation` for the ink-900 surface + pattern + isolation, but
   re-centers the content (vs. space-between) and carries no footer. */
.ds-slide--close { justify-content: flex-start; padding: var(--pv-space-12) var(--pv-space-16); }
.ds-slide--close > .ds-logo, .ds-close-center { position: relative; z-index: 1; }
.ds-close-center { flex: 1 1 auto; min-height: 0; max-width: 1400px; display: flex; flex-direction: column; justify-content: center; }

/* ── §10 missing-class fills ─────────────────────────────────────────
 * .ds-section--sage and .ds-proof-card are referenced in REFERENCE.md
 * §10 hard rules but were not yet defined in the v6.0 bundle.
 * ──────────────────────────────────────────────────────────────────── */

.ds-section--sage {
  background: var(--pv-sage-600);
  /* Type recoloring comes from this class itself; .ds-on-dark is optional
     here and still correct to write. Reserved for closing-CTA, claim-band,
     and deck section-divider slides only (§10 sage scope rule). */
}

/* Buttons on the sage band (pattern.closing-cta-sage, REFERENCE.md §18 Slide 19).
   `.ds-btn-primary` is sage-600 on sage-600 there — invisible as declared, and
   `--pv-border` rebinds to the dark stroke, so the ghost button is a near-black
   hairline on mid-sage. Both are rebound here rather than in the pattern, so any
   future sage surface inherits the fix. Tokens only — no new values. */
.ds-section--sage .ds-btn-primary {
  background: var(--pv-near-white);
  color: var(--pv-sage-600);
}
.ds-section--sage .ds-btn-primary:hover {
  background: #FFFFFF;
  color: var(--pv-sage-700);
}
.ds-section--sage .ds-btn-ghost {
  color: var(--pv-near-white);
  border-color: var(--pv-near-white);
}
.ds-section--sage .ds-btn-ghost:hover {
  background: var(--pv-near-white);
  color: var(--pv-sage-600);
}


.ds-proof-card {
  background: var(--pv-bg);
  border: 1px solid var(--pv-border);
  border-radius: var(--pv-radius-xl);
  padding: var(--pv-space-6);
  display: flex;
  flex-direction: column;
  gap: var(--pv-space-4);
  /* White-bg + border because it hosts nested stat sub-cards (§10
     card border rule exception). */
}

/* ── §19 Logo primitive (v6.4) ───────────────────────────────────────
 * Drives Provectus's wordmark/mark from `assets/logo/`. Color is
 * bound through `currentColor` so a single SVG file renders correctly
 * on every surface. Variants control render height; placement is
 * constrained by §10 (cover top-left + closing slot only).
 * Source: assets/logo/wordmark.svg, mark.svg.
 * ──────────────────────────────────────────────────────────────────── */

.ds-logo {
  display: inline-flex;
  align-items: center;
  height: 32px;                    /* default — closer/contact slot */
  color: var(--pv-text);           /* ink-900 on light surfaces */
  text-decoration: none;
  line-height: 0;                  /* prevent baseline gap under inline SVG */
}
.ds-logo svg,
.ds-logo img {
  height: 100%;
  width: auto;
  display: block;
  fill: currentColor;              /* SVG paths inherit the color */
}

/* Cover slot — top-left, 40px. Pair with absolute positioning at the
   slide level so it doesn't push other content down. */
.ds-logo--cover  { height: 40px; }

/* Footer slot — tiny, low-contrast. Reserved; the slide-footer mono
   text token is the default. Use sparingly. */
.ds-logo--footer { height: 18px; opacity: 0.7; }

/* Mark-only variant — square, used when the full wordmark would be too
   wide (favicons, avatars, tight stat slots). */
.ds-logo--mark   { height: 32px; aspect-ratio: 26 / 31; }

/* Dark-surface rebind — covers, sage band, any container that opts in
   via .ds-on-dark. Token resolves to near-white. */
.ds-on-dark .ds-logo,
.ds-cover--presentation .ds-logo,
.ds-section--sage .ds-logo,
.ds-section--dark .ds-logo {
  color: var(--pv-near-white);
}

/* Typographic logo fallback (§20 rule 14) — used only when no SVG asset
   resolves: a sage dot + the wordmark in the display face. Same color
   binding as .ds-logo so it rebinds to near-white on dark surfaces. */
.ds-cover-logo {
  display: inline-flex;
  align-items: center;
  gap: var(--pv-space-2);
  font-family: var(--pv-font-display);
  font-weight: 700;
  font-size: var(--pv-text-xl);
  letter-spacing: -0.01em;
  color: var(--pv-text);
}
.ds-cover-logo::before {
  content: "";
  width: 0.6em;
  height: 0.6em;
  border-radius: var(--pv-radius-full);
  background: var(--pv-sage-600);
}
.ds-on-dark .ds-cover-logo,
.ds-cover--presentation .ds-cover-logo,
.ds-section--sage .ds-cover-logo,
.ds-section--dark .ds-cover-logo {
  color: var(--pv-near-white);
}

/* ── §19.4 Icon primitive (icons) ────────────────────────────────────
 * Lucide line icons as a first-class DS primitive — the same standard the
 * /pro-chart figure rules (§4a) and the /presentation skill already use.
 * Inline the raw Lucide <svg> (viewBox 0 0 24 24); this class sizes it,
 * sets the 1.5 stroke, and binds the color to the surface's eyebrow/label
 * tone via currentColor. Never emoji / another set / a hand-drawn glyph.
 * ──────────────────────────────────────────────────────────────────── */
.ds-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  width: var(--pv-icon-size, 24px);
  height: var(--pv-icon-size, 24px);
  color: var(--pv-slate);            /* eyebrow/label tone on light surfaces */
  line-height: 0;
}
.ds-icon svg {
  width: 100%;
  height: 100%;
  display: block;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;                 /* NOT Lucide's shipped 2 */
  stroke-linecap: round;
  stroke-linejoin: round;
}
.ds-icon--sm { --pv-icon-size: 20px; }
.ds-icon--lg { --pv-icon-size: 32px; }
/* Surface rebinds — match the eyebrow tone of the surface. Dark first, sage
   last, so a sage slide that also carries .ds-on-dark resolves to sage-200. */
.ds-on-dark .ds-icon,
.ds-section--dark .ds-icon { color: var(--pv-body-light); }   /* pack-value on ink-900 */
.ds-section--sage .ds-icon { color: var(--pv-sage-200); }     /* pack-value on sage */

/* ── §4.23 Semantic tone modifiers (v6.9) ────────────────────────────
 * ONE modifier family, not four forked card classes. Each `.ds-tone--*`
 * rebinds three local custom properties from the §2.3a aliases and does
 * nothing else; the components below consume those three.
 *
 * Declared AFTER `.ds-card` and after the `.ds-icon` surface rebinds
 * above, per the §11.1 rule-order trap: `.ds-card.ds-tone--positive` beats
 * `.ds-card` on specificity, but `.ds-tone--positive .ds-icon` only ties
 * with `.ds-on-dark .ds-icon` at (0,2,0) — source order is what decides it,
 * so this block must not be moved earlier in the file.
 *
 * Tone is NEVER carried by colour alone (§10 rule 1). Sage and sienna are
 * the exact pair deuteranopia collapses. Every toned element also carries a
 * Lucide glyph whose subject matches the card AND a `.ds-tone-label` that
 * says the stance in words. A card differing from its neighbours only by
 * fill is a defect, and `tests/test_scaffolds.py` fails on one.
 * ──────────────────────────────────────────────────────────────────── */
.ds-tone--positive {
  --tone-ink:    var(--pv-tone-positive-ink);
  --tone-bg:     var(--pv-tone-positive-bg);
  --tone-stroke: var(--pv-tone-positive-stroke);
}
.ds-tone--caution {
  --tone-ink:    var(--pv-tone-caution-ink);
  --tone-bg:     var(--pv-tone-caution-bg);
  --tone-stroke: var(--pv-tone-caution-stroke);
}
.ds-tone--critical {
  --tone-ink:    var(--pv-tone-critical-ink);
  --tone-bg:     var(--pv-tone-critical-bg);
  --tone-stroke: var(--pv-tone-critical-stroke);
}
.ds-tone--neutral {
  --tone-ink:    var(--pv-tone-neutral-ink);
  --tone-bg:     var(--pv-tone-neutral-bg);
  --tone-stroke: var(--pv-tone-neutral-stroke);
}

/* A toned card takes its surface and its 1px stroke from the modifier.

   `.ds-card-featured` is included (v6.9, added after testing the layer on a
   real shipped deck). Cream cards carry no border by default — surface
   contrast alone lifts them, §10 — but a TONED featured card is no longer a
   cream card: its surface is the tone tint, and the tone stroke is half of
   what separates it from its neighbours. This is the same shape as the
   existing auto-flip rule, which swaps the featured card cream->white AND
   applies the border in one step; a surface change brings the border with it.
   Leaving it out was worse than either: an author writing
   `.ds-card-featured.ds-tone--caution` got a SILENT no-op and shipped an
   untoned deck, which is the exact failure mode this layer exists to remove.

   `print-color-adjust: exact` is for the BROWSER'S OWN print path, not for
   `scripts/export.py`. Measured both, at 72dpi off the exported PDF:
     - export.py (`print_background=True`): the tints survive with or without
       this declaration — pack-value and pack-value land pixel-exact either way.
     - Cmd-P → Save as PDF with "Background graphics" left unticked, which is
       the default and which the deck scaffold's own header tells authors to
       use: WITHOUT this declaration both tints print as pure #FFFFFF.
   That second path is the one that matters here. A toned card printing white
   loses the only non-verbal half of the signal, and the reader is left with
   six identical cards — the exact defect the tone layer exists to fix.

   NOTE, out of scope for 6.9: every other painted surface in this bundle has
   the same behaviour on that path — the ink-900 cover prints white too. That
   predates the tone layer and fixing it means touching every surface class,
   so it is reported rather than quietly changed here. */
.ds-card.ds-tone--positive,
.ds-card.ds-tone--caution,
.ds-card.ds-tone--critical,
.ds-card.ds-tone--neutral,
.ds-card-featured.ds-tone--positive,
.ds-card-featured.ds-tone--caution,
.ds-card-featured.ds-tone--critical,
.ds-card-featured.ds-tone--neutral {
  background: var(--tone-bg);
  border: 1px solid var(--tone-stroke);
  -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
}

/* The ONE amendment to §19.4: inside a tone scope the icon resolves its
   currentColor to the tone ink rather than the surface eyebrow tone.
   Outside a tone scope §19.4 is unchanged. */
.ds-tone--positive .ds-icon,
.ds-tone--caution .ds-icon,
.ds-tone--critical .ds-icon,
.ds-tone--neutral .ds-icon { color: var(--tone-ink); }

/* The mono eyebrow inside a toned card — this is what carries the tone in
   WORDS, which §10 rule 1 makes mandatory. Shape is fixed here; the
   vocabulary is not: 1–3 words stating what the reader gets or must do, in
   the card's own terms. Never a category name ("PROTECTED"), never an
   evaluative adjective, never a restatement of the card title. See §10
   rule 1 and DECISIONS.md decision 5. */
.ds-tone-label {
  /* Flex so the glyph MAY sit on the label's own row instead of above it.
     A label with no icon inside renders identically — one text child in a
     flex row is the same box it was. v6.9, added after retro-fitting tone to
     a real shipped slide: the glyph above the label costs ~44px per card, and
     on an already-tight vertical stack that pushed the last card off the
     slide. Inline costs nothing and still carries both signals, so the
     bundle should offer it rather than every deck re-inventing it in a local
     <style>. See §10 tone rule 3. */
  display: flex;
  align-items: center;
  gap: var(--pv-space-2);
  font-family: var(--pv-font-mono);
  font-size: var(--pv-text-xs);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: var(--pv-tracking-wide);
  line-height: 1.45;
  color: var(--tone-ink, var(--pv-text-eyebrow));
  margin: 0 0 var(--pv-space-3);
}
/* An inline glyph drops one tier — it is set beside 18px mono, not standing
   alone as a card marker. Simple glyphs only: §10 tone rule 3 keeps composite
   glyphs (shield-ban and siblings) at 32px, so those stay above the label. */
.ds-tone-label .ds-icon { --pv-icon-size: 20px; }

/* Reserve the label line on an untoned card sharing a grid with toned ones.
   `.ds-tone-label` adds a line of height. Without this, the neutral cards'
   titles ride up and the row loses its baseline — visible and ugly at deck
   scale, confirmed in render. `visibility: hidden` drops the ink and takes the
   element out of the accessibility tree.

   The zero-width space is load-bearing, not belt-and-braces. `visibility:
   hidden` preserves an element's LAYOUT, and an EMPTY block element has almost
   none: it generates no line box, so its height is 0 and only its margins
   survive. Measured: the untoned card's title still rode up 26.09px — the
   whole line box — with `visibility: hidden` and an empty `<p>`. The `::after`
   forces a line box at the label's own line-height, and the reservation then
   holds whether or not the author put anything between the tags.
   `tests/test_computed_values.py` asserts the titles share one baseline, and
   asserts that removing the reservation still breaks it — so the check cannot
   quietly stop proving anything. */
.ds-tone-label--reserved { visibility: hidden; }
.ds-tone-label--reserved::after { content: "\200B"; }

/* On a dark ground the tint is dropped, not darkened: a tinted plaque on
   ink-900 muddies. The tone reads from the icon ink + the stroke there.
   `.ds-cover--presentation` is listed for completeness — §12 forbids tone
   on the cover and the closing bookend, and nothing should reach this. */
.ds-on-dark .ds-tone--positive,
.ds-section--dark .ds-tone--positive,
.ds-slide--dark .ds-tone--positive,
.ds-cover--presentation .ds-tone--positive {
  --tone-ink: var(--pv-tone-positive-ink-dark);
  --tone-bg:  transparent;
}
.ds-on-dark .ds-tone--caution,
.ds-section--dark .ds-tone--caution,
.ds-slide--dark .ds-tone--caution,
.ds-cover--presentation .ds-tone--caution {
  --tone-ink: var(--pv-tone-caution-ink-dark);
  --tone-bg:  transparent;
}
.ds-on-dark .ds-tone--critical,
.ds-section--dark .ds-tone--critical,
.ds-slide--dark .ds-tone--critical,
.ds-cover--presentation .ds-tone--critical {
  --tone-ink: var(--pv-tone-critical-ink-dark);
  --tone-bg:  transparent;
}
.ds-on-dark .ds-tone--neutral,
.ds-section--dark .ds-tone--neutral,
.ds-slide--dark .ds-tone--neutral,
.ds-cover--presentation .ds-tone--neutral {
  --tone-ink: var(--pv-tone-neutral-ink-dark);
  --tone-bg:  transparent;
}

/* ── Ported primitives (from the Astro /ds §4.12–§4.22) ──────────────
 * Portable .ds-* translations of components the standalone extraction
 * dropped. /ds tokens map as: --pv-bg-inverse → --pv-ink-900,
 * --pv-bg-accent-bold → --pv-sage-600, --pv-text-on-accent-bold →
 * --pv-near-white. See REFERENCE.md §4.
 * ──────────────────────────────────────────────────────────────────── */

/* §4.12 Bento grids — even 2/3/4-col + asymmetric magazine (feature 2×2) */
.ds-bento { display: grid; grid-template-columns: 1fr; gap: var(--pv-space-6); }
@media (min-width: 768px) {
  .ds-bento { grid-template-columns: repeat(3, 1fr); }
}
@media (min-width: 1024px) {
  .ds-bento--magazine { grid-template-columns: repeat(4, 1fr); grid-auto-flow: dense; }
  .ds-bento--magazine > .ds-card--feat { grid-column: span 2; grid-row: span 2; }
}
.ds-card--feat .ds-card-title { font-size: var(--pv-text-2xl); }

/* §4.13 Hairline rows — divider list with hover nudge */
.ds-row-list { display: flex; flex-direction: column; }
.ds-row {
  display: flex; align-items: center; justify-content: space-between; gap: var(--pv-space-4);
  padding: var(--pv-space-4) 0;
  border-bottom: 1px solid var(--pv-border);
  text-decoration: none; color: inherit;
  transition: padding-left var(--pv-dur) var(--pv-ease);
}
.ds-row:first-child { border-top: 1px solid var(--pv-border); }
.ds-row:hover { padding-left: var(--pv-space-2); }
.ds-row-text { display: flex; flex-direction: column; gap: 2px; }
.ds-row-title { font-family: var(--pv-font-display); font-weight: 600; color: var(--pv-text); }
.ds-row-desc { font-size: var(--pv-text-sm); color: var(--pv-text-tertiary); }
/* `.ds-row-*` render as <p>, so the UA's default 1em margin applies and adds
   ~88px per row at deck scale — enough to push §18 Slide 10 (index-list) off
   a 1080 canvas with five rows, and off 900 with four. Neither lint tier sees
   layout, so it surfaced only in a pixel pass. Rhythm belongs to the row
   container, not to the UA. */
.ds-row-title, .ds-row-desc { margin: 0; }
.ds-row-arrow {
  color: var(--pv-text-tertiary);
  transition: color var(--pv-dur) var(--pv-ease), transform var(--pv-dur) var(--pv-ease);
}
.ds-row:hover .ds-row-arrow { color: var(--pv-text-accent); transform: translateX(4px); }

/* §4.14 Detail rows — label + body, 2-col */
.ds-detail-grid { display: grid; grid-template-columns: 1fr; gap: var(--pv-space-6); }
@media (min-width: 768px) {
  .ds-detail-grid { grid-template-columns: 1fr 1fr; }
}
.ds-detail-row { display: flex; flex-direction: column; gap: var(--pv-space-2); }

/* §4.15 Sequential step grid — number badge + flow arrow (lg+ only) */
.ds-step { position: relative; }
.ds-step-number {
  position: absolute; top: var(--pv-space-2); right: var(--pv-space-3);
  font-family: var(--pv-font-mono); font-size: 0.6rem;
  letter-spacing: var(--pv-tracking-wider); color: var(--pv-text-accent);
}
.ds-flow-arrow {
  position: absolute; top: 50%; left: 100%;
  transform: translate(-50%, -50%); margin-left: 6px;
  color: var(--pv-text-accent); font-weight: 600;
  pointer-events: none; display: none;
}
@media (min-width: 1024px) { .ds-flow-arrow { display: block; } }

/* §4.16 Sub-detail panel — 1-1-1 with a full-row card */
.ds-subdetail-grid { display: grid; grid-template-columns: 1fr; gap: var(--pv-space-3); }
@media (min-width: 768px) {
  .ds-subdetail-grid { grid-template-columns: repeat(3, 1fr); }
  .ds-subdetail-grid > .ds-subdetail--full { grid-column: 1 / -1; }
}

/* §4.17 SVG diagram — foreignObject tooltip + dashed connector */
.ds-diagram-tooltip {
  background: var(--pv-ink-900);
  padding: var(--pv-space-3) var(--pv-space-4);
  border-radius: var(--pv-radius-lg);
  height: 100%; box-sizing: border-box;
}
.ds-diagram-tooltip__label {
  font-family: var(--pv-font-mono); font-size: 0.625rem; font-weight: 600;
  letter-spacing: var(--pv-tracking-wider); text-transform: uppercase;
  color: var(--pv-sage-200); margin-bottom: 0.35rem;
}
.ds-diagram-tooltip__body {
  font-family: var(--pv-font-sans); font-size: 0.78rem; line-height: 1.4;
  color: var(--pv-near-white);
}
.ds-diagram-connector { stroke: var(--pv-sage-600); stroke-width: 1.5; stroke-dasharray: 3 3; }

/* §4.18 Outcome / takeaway card — dark "before" + sage "target" */
.ds-outcome {
  padding: var(--pv-space-4) var(--pv-space-6);
  border-radius: var(--pv-radius-lg);
  background: var(--pv-ink-900);
}
.ds-outcome--target { background: var(--pv-sage-600); }
.ds-outcome__label {
  font-family: var(--pv-font-mono); font-size: var(--pv-text-xs); font-weight: 600;
  letter-spacing: var(--pv-tracking-widest); text-transform: uppercase;
  color: var(--pv-sage-200); margin-bottom: var(--pv-space-1);
}
.ds-outcome__body { font-size: var(--pv-text-sm); line-height: var(--pv-leading-relaxed); color: var(--pv-near-white); }

/* §4.21 Algorithmic canvas — generative hero background (drive with JS per §4) */
.ds-hero-canvas {
  position: absolute; inset: 0; width: 100%; height: 100%;
  color: var(--pv-border-accent); opacity: 0.35;
  pointer-events: none; z-index: 0;
  mask-image: linear-gradient(to right, transparent 0%, black 18%, black 100%);
}

/* §4.22 Form primitives — authored portable (/ds defers to pv-tokens.css) */
.ds-field { display: flex; flex-direction: column; gap: var(--pv-space-2); }
.ds-label { font-family: var(--pv-font-display); font-size: var(--pv-text-sm); font-weight: 600; color: var(--pv-text); }
.ds-input, .ds-textarea {
  font-family: var(--pv-font-sans); font-size: var(--pv-text-base);
  color: var(--pv-text); background: var(--pv-bg);
  border: 1px solid var(--pv-border); border-radius: var(--pv-radius-md);
  padding: var(--pv-space-3) var(--pv-space-4);
  transition: border-color var(--pv-dur) var(--pv-ease), box-shadow var(--pv-dur) var(--pv-ease);
}
.ds-textarea { min-height: 7rem; resize: vertical; }
.ds-input::placeholder, .ds-textarea::placeholder { color: var(--pv-text-tertiary); }
.ds-input:focus-visible, .ds-textarea:focus-visible {
  outline: none;
  border-color: var(--pv-sage-600);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--pv-sage-600) 25%, transparent);
}
.ds-input:disabled, .ds-textarea:disabled { background: var(--pv-bg-secondary); color: var(--pv-muted); cursor: not-allowed; }
.ds-check-row { display: flex; align-items: flex-start; gap: var(--pv-space-3); }
.ds-checkbox { width: 1.1rem; height: 1.1rem; margin-top: 0.15rem; accent-color: var(--pv-sage-600); }
.ds-field-help { font-size: var(--pv-text-sm); color: var(--pv-text-tertiary); }
/* Error text stays on a tinted chip (never bare sienna on white — §10/§12).
   v6.9: refactored onto the `--pv-tone-critical-*` aliases. The resolved
   colours are unchanged — pack-value on pack-value, exactly as before — but the
   component no longer names a raw family token, which §12 now forbids. This
   is the one component that predates the tone layer, so it is also the proof
   that the alias rule applies to everything. */
.ds-field-error {
  font-size: var(--pv-text-sm); color: var(--pv-tone-critical-ink);
  background: var(--pv-tone-critical-bg);
  padding: var(--pv-space-1) var(--pv-space-2); border-radius: var(--pv-radius-sm);
  align-self: flex-start;
}



/* ════════════════════════════════════════════════════════════════════
 * Deck type floor — REFERENCE.md §10 (22px body), §11.8 (never mix the
 * deck and web scales), §18 Slide 21 (hard 16px floor for text inside a
 * figure on a slide).
 *
 * The components below pre-date those rules. Each declares a web tier
 * (--pv-text-xs is an 11px eyebrow, --pv-text-sm a 13px small body) that
 * is not legible at projection distance, and nothing scoped them away
 * from the deck shell — so a slide composed from shared components
 * silently rendered web-scale type. Measured on a fixture instantiating
 * every ds- class inside .ds-slide: 104 elements below 16px, the
 * lowest at 9px (.ds-step-number). tests/test_computed_values.py
 * reproduces the sweep and asserts it is now zero.
 *
 * Raising the web tokens themselves would break web. These rules scope
 * the deck instead: same components, deck tiers inside .ds-slide.
 * ════════════════════════════════════════════════════════════════════ */

/* Body copy. One rule retires the whole inherit-the-web-body class of
   defect — ~77 probes, including every unclassed text node in
   .ds-slide-inner / .ds-cover-center / .ds-close-center.

   Declared on the slide, not on `html.ds-deck body`. Keying it to a class on
   the document element made the whole deck type scale depend on one attribute
   in the file's first line: drop `class="ds-deck"` and slide text silently
   fell back to the 15px web body. Scoping it here also stops it leaking onto
   deck chrome that lives outside a slide. */
.ds-slide { font-size: var(--pv-text-deck-body); }

/* Eyebrows. `.ds-eyebrow` (web, 11px) and `.ds-eyebrow--deck` (18px mono)
   differ by a suffix, so dropping `--deck` on a slide silently yielded
   10px type — the largest sub-floor drop in the sweep. Rather than only
   lifting the size and leaving two eyebrows that look different on the
   same slide, give the unsuffixed class the full deck treatment inside a
   slide: the two are now identical in a deck and the trap is closed. */
.ds-slide .ds-eyebrow,
.ds-slide .ds-section-eyebrow {
  font-family: var(--pv-font-mono);
  font-size: var(--pv-text-deck-eyebrow);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  line-height: 1.6;
}

/* `.ds-stat-label` → Presentation/Label (16), one step below the eyebrow.
   It is the caption under a 96px stat value in pattern.stats-band-ink
   (§18 Slide 07), so it reads as subordinate to the number rather than as a
   second eyebrow. It sat at the eyebrow tier (18) in v6.6, chosen by analogy
   — the spec names no tier for this class — and at 18 a four-column band
   wrapped its captions onto two lines and crowded the columns. 16 is the
   §18 Slide 21 floor, so it stays legible at projection distance. */
.ds-slide .ds-stat-label {
  font-size: var(--pv-text-deck-footer);
  letter-spacing: 0.06em;
  line-height: 1.45;
}

/* Caption / label layer → Presentation/Eyebrow (18). */
.ds-slide .ds-card-tag,
.ds-slide .ds-tone-label,
.ds-slide .ds-claim-label,
.ds-slide .ds-outcome__label,
.ds-slide .ds-phase-num,
.ds-slide .ds-phase-duration,
.ds-slide .ds-slide-num,
.ds-slide .ds-label,
.ds-slide .ds-field-help,
.ds-slide .ds-field-error {
  font-size: var(--pv-text-deck-eyebrow);
  letter-spacing: 0.06em;
  line-height: 1.45;
}

/* Reading text → Presentation/Body (22). */
.ds-slide .ds-body,
.ds-slide .ds-list li,
.ds-slide .ds-card-desc,
.ds-slide .ds-claim-body,
.ds-slide .ds-outcome__body,
.ds-slide .ds-row-desc,
.ds-slide .ds-input,
.ds-slide .ds-textarea,
.ds-slide .ds-phase-heading {
  font-size: var(--pv-text-deck-body);
}

/* Lede → Presentation/Body Lg (26), matching `.ds-lede--deck`. */
.ds-slide .ds-lede { font-size: var(--pv-text-deck-lede); }

/* Button labels → Presentation/Title Sm (28). §18 Slide 19
   (pattern.closing-cta-sage) names this tier for button labels. */
.ds-slide .ds-btn,
.ds-slide .ds-btn-lg {
  font-size: var(--pv-text-deck-secondary);
}

/* In-figure text → Presentation/Label (16), the §18 Slide 21 floor. A deck
   figure is drawn to a 1792-unit canvas where one unit is one exported
   pixel (§17), so 16 units here is 16px on the exported slide. */
.ds-slide .ds-step-number,
.ds-slide .ds-diagram-tooltip__label,
.ds-slide .ds-diagram-tooltip__body {
  font-size: var(--pv-text-deck-footer);
}

/* Number pill. Its height / min-width / padding are hard-coded px, so they
   are immune to the root size and a 16px glyph does not fit a 26px pill —
   the box has to grow with the type. */
.ds-slide .ds-pill {
  font-size: var(--pv-text-deck-footer);
  height: 34px;
  min-width: 44px;
  padding: 0 14px;
}


/* ── §22 Dark theme for web pages (v6.10) ─────────────────────────────
 * A page-level mode, opt-in: <body class="ds-on-dark ds-theme--dark">.
 * Light stays the default; a page is built dark only when the author asks.
 * Web pages and artifacts; a deck on request (REFERENCE.md §22.5).
 *
 * `.ds-on-dark` on <body> brings every existing on-dark rebinding (type,
 * logo, icons, tones) to the whole page. The rules below cover what the
 * bundle otherwise paints with a light value of its own. Every value is a
 * token; the two new ones (`--pv-stroke-on-dark`, `--pv-sage-tone-ink-dark`)
 * live in :root and come from Provectus pack. See REFERENCE.md §22.
 * ──────────────────────────────────────────────────────────────────── */

/* The ink scale resolves to the dark scale on the root as well as on <body>:
   a custom property declared on :root (a builder's `:root { --x: var(--pv-ink-700) }`)
   is computed there and inherited as a value, so a rebinding on <body> alone
   would leave it ink. Field report, local test of 3.16.0: a dark deck's table
   header came out ink-700 blue. */
html:has(> body.ds-theme--dark) {
  background: var(--pv-dark-900);             /* overscroll, and below a short page */
  --pv-ink-900: var(--pv-dark-900);
  --pv-ink-800: var(--pv-dark-800);
  --pv-ink-700: var(--pv-dark-700);
}

.ds-theme--dark {
  color-scheme: dark;                         /* native controls and scrollbars */
  --pv-bg-secondary: var(--pv-ink-800);       /* cream's role: the card surface */
  --pv-bg-accent:    var(--pv-ink-700);       /* ghost-button hover */
  /* v6.12: the dark ground is a neutral near-black. Inside the theme the ink
     scale resolves to it, so every rule below that names ink-900/800/700
     (and a deck's cover and close) takes the dark ground without a rewrite. */
  --pv-ink-900: var(--pv-dark-900);
  --pv-ink-800: var(--pv-dark-800);
  --pv-ink-700: var(--pv-dark-700);
  /* v6.12: the same text ladder as light, step for step: three brightness
     steps (text, secondary, tertiary) and two hues (slate eyebrow, sage
     labels and links). Every step clears AA on dark-900, -800 and -700. */
  --pv-text-tertiary: var(--pv-charcoal-400);
  --pv-text-eyebrow:  var(--pv-slate-on-dark);
  --pv-text-label:    var(--pv-sage-tone-ink-dark);
  --pv-text-accent:   var(--pv-sage-tone-ink-dark);
  --pv-text-link:     var(--pv-sage-tone-ink-dark);
  /* stroke-dark is 1.29:1 on ink-900 and disappears across a page. */
  --pv-border: var(--pv-stroke-on-dark);
}

/* Surfaces. A card is one step lighter than its ground: ink-800 on the page,
   ink-700 inside a band. Anything ink-900 in light would vanish on the ink
   page, so it steps up to ink-700. */
.ds-theme--dark .ds-band-light--cream { background: var(--pv-ink-800); }
.ds-theme--dark .ds-band-light--sage  { background: var(--pv-sage-800); }
.ds-theme--dark .ds-claim--card       { background: var(--pv-ink-700); }
.ds-theme--dark .ds-phase             { background: var(--pv-ink-800); }
.ds-theme--dark .ds-eyebrow-accent    { color: var(--pv-text-label); }
.ds-theme--dark .ds-section--alt .ds-card-featured:not([class*="ds-tone--"]) { background: var(--pv-ink-700); }
.ds-theme--dark .ds-proof-card { background: var(--pv-ink-800); }
.ds-theme--dark .ds-proof-card :where(.ds-card, .ds-card-featured) { background: var(--pv-ink-700); }
.ds-theme--dark .ds-outcome:not(.ds-outcome--target),
.ds-theme--dark .ds-diagram-tooltip { background: var(--pv-ink-700); }
.ds-theme--dark .ds-outcome:not(.ds-outcome--target) .ds-outcome__label,
.ds-theme--dark .ds-diagram-tooltip__label { color: var(--pv-body-light); }
.ds-theme--dark .ds-diagram-connector { stroke: var(--pv-sage-200); }   /* sage-600 is 1.94:1 on ink */

/* The one structural band. On an ink page an ink band disappears, so the
   accent moves to sage-600, with a white primary like the sage section. */
.ds-theme--dark .ds-section--dark { background: var(--pv-sage-600); }
.ds-theme--dark .ds-section--dark .ds-btn-primary { background: var(--pv-near-white); color: var(--pv-sage-600); }
.ds-theme--dark .ds-section--dark .ds-btn-ghost { color: var(--pv-near-white); border-color: var(--pv-near-white); }
/* Tertiary text (stat labels, slide footers, meta) on a sage-600 band is
   sage-200, 5.09:1. The band's own rebinding set charcoal-400, 2.84:1: on the
   dark page's accent band and on every light deck's divider and closing CTA. */
.ds-section--sage,
.ds-theme--dark .ds-section--dark { --pv-text-tertiary: var(--pv-sage-200); }

/* Toned cards. The bundle drops the tint on dark but kept the light tone
   strokes, which read as bright frames on ink. A toned card is an ink-800
   card whose 1px border takes the on-dark tone ink of its icon and label. */
.ds-theme--dark .ds-card[class*="ds-tone--"],
.ds-theme--dark .ds-card-featured[class*="ds-tone--"] {
  background: var(--pv-ink-800);
  border-color: var(--tone-ink);
}
.ds-theme--dark .ds-card.ds-tone--neutral,
.ds-theme--dark .ds-card-featured.ds-tone--neutral { border-color: var(--pv-border); }
/* sage-200 is 18% saturated against 54% (ochre-300) and 65% (sienna-500), so
   the positive card read grey beside them. The positive ink on dark keeps
   sage's hue at 35% saturation (8.0:1 on ink-800). */

.doc code { font-family: var(--pv-font-mono); font-size: .86em; background: var(--pv-bg-secondary); padding: 1px 5px; border-radius: var(--pv-radius-sm); color: var(--pv-text); }
.doc pre { background: var(--pv-bg-secondary); padding: var(--pv-space-3); border-radius: var(--pv-radius-md); overflow-x: auto; font-size: var(--pv-text-sm); }
.doc pre code { background: none; padding: 0; }
.doc table { border-collapse: collapse; margin: var(--pv-space-3) 0; font-size: var(--pv-text-sm); display: block; overflow-x: auto; }
.doc th, .doc td { border: 1px solid var(--pv-border); padding: 5px 8px; text-align: left; vertical-align: top; }
.doc th { background: var(--pv-bg-secondary); color: var(--pv-text); }
.doc blockquote { margin: var(--pv-space-2) 0; padding-left: var(--pv-space-3); border-left: 3px solid var(--pv-sage-200); }
.doc .verdict {
  display: flex; align-items: center; gap: var(--pv-space-2);
  font-family: var(--pv-font-mono); font-weight: 700; font-size: var(--pv-text-lg);
  padding: var(--pv-space-3) var(--pv-space-4); border-radius: var(--pv-radius-md); margin-top: var(--pv-space-4); border: 1px solid;
}
.doc .verdict.ok { background: var(--pv-tone-positive-bg); color: var(--pv-tone-positive-ink); border-color: var(--pv-tone-positive-stroke); }
.doc .verdict.fail { background: var(--pv-tone-critical-bg); color: var(--pv-tone-critical-ink); border-color: var(--pv-tone-critical-stroke); }

.conn { display: inline-flex; align-items: center; gap: 6px; margin-left: var(--pv-space-2); }
.conn .dot { width: 7px; height: 7px; background: var(--pv-sage-600); }
.conn.off { color: var(--pv-tone-critical-ink); }
.conn.off .dot { background: var(--pv-tone-critical-ink); }

@media (max-width: 900px) {
  body { padding: var(--pv-space-4); }
  .panes { grid-template-columns: 1fr; }
  .pipeline { flex-direction: column; overflow: visible; }
  .card { flex: 0 0 auto; }
  .joint { flex: 0 0 auto; flex-direction: row; justify-content: flex-start; padding: var(--pv-space-2) 0 var(--pv-space-2) var(--pv-space-6); }
  .joint .line { width: 34px; height: 40px; flex: 0 0 34px; }
  .joint .line::before { left: 50%; right: auto; top: 0; bottom: 0; width: 2px; height: auto; margin: 0 0 0 -1px; }
  .meters { gap: var(--pv-space-5); }
}

/* ── the human's call on the plan ─────────────────────── */
body:has(#decision:not([hidden])) { grid-template-rows: auto auto auto 1fr; }
.decision[hidden] { display: none; }
.decision {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--pv-space-4) var(--pv-space-6);
  padding: var(--pv-space-5) var(--pv-space-6); border: 2px solid var(--pv-sage-600); border-radius: var(--pv-radius-md);
  background: var(--pv-sage-band); animation: rise .25s ease-out;
}
.decision.quiet { border-width: 1px; border-color: var(--pv-border); background: var(--pv-bg-secondary); }
.decision .ask { flex: 1 1 420px; min-width: 0; }
.decision .eyebrow { border: 0; padding: 0; }
.decision h3 {
  margin: var(--pv-space-1) 0; font-family: var(--pv-font-display); font-size: var(--pv-text-2xl);
  font-weight: 700; letter-spacing: var(--pv-tracking-tight); color: var(--pv-text);
}
.decision p { margin: 0; color: var(--pv-text-secondary); font-size: var(--pv-text-md); }
.decision .said { margin: var(--pv-space-2) 0 0; padding: 0; list-style: none; display: grid; gap: var(--pv-space-1); }
.decision .said li { color: var(--pv-text); font-size: var(--pv-text-md); }
.decision .said li::before { content: "“"; color: var(--pv-text-tertiary); }
.decision .said li::after { content: "”"; color: var(--pv-text-tertiary); }
.decision .actions { display: flex; gap: var(--pv-space-3); flex-wrap: wrap; }
.decision button {
  font: inherit; font-size: var(--pv-text-md); font-weight: 700; letter-spacing: var(--pv-tracking-wide, .01em);
  display: inline-flex; align-items: center; gap: var(--pv-space-2); cursor: pointer;
  padding: var(--pv-space-3) var(--pv-space-6); border-radius: var(--pv-radius-md); border: 2px solid transparent;
}
.decision button:disabled { opacity: .5; cursor: progress; }
.decision .approve { background: var(--pv-sage-600); color: var(--pv-white); }
.decision .approve:hover:not(:disabled) { filter: brightness(1.08); }
.decision .deny { background: var(--pv-bg); color: var(--pv-tone-critical-ink); border-color: var(--pv-tone-critical-stroke); }
.decision .deny:hover:not(:disabled) { background: var(--pv-tone-critical-bg); }
.decision .plain { background: transparent; color: var(--pv-text-secondary); }
.decision form { flex: 1 1 100%; display: grid; gap: var(--pv-space-3); }
.decision textarea {
  font: inherit; font-size: var(--pv-text-md); width: 100%; min-height: 84px; resize: vertical; box-sizing: border-box;
  padding: var(--pv-space-3) var(--pv-space-4); border: 1px solid var(--pv-border); border-radius: var(--pv-radius-md);
  background: var(--pv-bg); color: var(--pv-text);
}
.decision .error { color: var(--pv-tone-critical-ink); font-weight: 600; }
.decision.quiet .ic { animation: spin 1s linear infinite; color: var(--pv-sage-600); }
@keyframes rise { from { opacity: 0; transform: translateY(-6px); } }
@media (prefers-reduced-motion: reduce) { .decision, .decision.quiet .ic { animation: none; } }
</style>
